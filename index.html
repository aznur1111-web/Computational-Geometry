<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="color-scheme" content="dark light">
<meta name="description" content="aznur / geometry lab, a single-file course for computational geometry">
<title>aznur / geometry lab</title>
<style>
:root{
  color-scheme:dark;
  --bg:#161313;--panel:#1c1818;--panel2:#211d1d;--panel3:#1a1616;
  --line:#302c2c;--line2:#454040;
  --text:#f1eeee;--muted:#9a9898;--subtle:#646262;
  --accent:#f59e0b;--accent-hover:#d97706;--strong:#fbbf24;
  --good:#10b981;--warn:#facc15;--bad:#f87171;
  --shadow:none;--radius:4px;
}
:root[data-theme=light]{
  color-scheme:light;
  --bg:#fdfcfc;--panel:#faf8f7;--panel2:#f4f0ef;--panel3:#f4f0ef;
  --line:#dcd9d9;--line2:#c9c4c4;
  --text:#201d1d;--muted:#646262;--subtle:#9a9898;
  --accent:#b45309;--accent-hover:#92400e;--strong:#92400e;
  --good:#047857;--warn:#a16207;--bad:#b91c1c;
  --shadow:none;--radius:4px;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);
  font:13px/1.6 "IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  font-variant-numeric:tabular-nums}
button,input,select,textarea{font:inherit}
button,a,select{touch-action:manipulation}
button{cursor:pointer}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,a:focus-visible{
  outline:2px solid var(--accent);outline-offset:2px}
a{color:var(--accent);text-decoration:none}
a:hover{color:var(--accent-hover)}
.muted{color:var(--muted)}
.mono,code,pre,textarea{font-family:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}

/* ---------- topbar ---------- */
.topbar{height:60px;position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:16px;
  padding:0 20px;background:var(--bg);border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:center;gap:10px;color:var(--text)}
.brand-mark{width:30px;height:30px;border:1px solid var(--line2);border-radius:5px;
  background:var(--panel2);display:grid;place-items:center;color:var(--accent);font-weight:700;font-size:12px}
.brand strong{display:block;font-size:12.5px;line-height:1.2;font-weight:600;letter-spacing:-.005em}
.brand-sep{color:var(--subtle);font-weight:400}
.brand-sub{color:var(--muted);font-weight:400}
.brand small{display:block;font-size:9px;letter-spacing:.14em;color:var(--muted);margin-top:2px}
.top-meta{flex:1;color:var(--subtle);font-size:11px;letter-spacing:.02em}
.top-actions{display:flex;align-items:center;gap:6px}
.top-actions label{font-size:10px;color:var(--muted)}
select,.btn{border:1px solid var(--line2);background:var(--panel);color:var(--text);
  border-radius:4px;padding:7px 10px;font-size:11.5px}
.btn{font-weight:600;white-space:nowrap}
.btn:hover{border-color:var(--accent);color:var(--accent)}
.btn.primary{background:var(--accent);color:#1c1818;border-color:var(--accent)}
.btn.primary:hover{background:var(--accent-hover);border-color:var(--accent-hover);color:#1c1818}
:root[data-theme=light] .btn.primary{color:#fdfcfc}
:root[data-theme=light] .btn.primary:hover{color:#fdfcfc}

/* ---------- layout / sidebar ---------- */
.layout{display:grid;grid-template-columns:240px minmax(400px,1fr);max-width:1500px;margin:auto;
  min-height:calc(100vh - 60px)}
.sidebar{position:sticky;top:60px;height:calc(100vh - 60px);overflow:auto;border-right:1px solid var(--line);
  padding:18px 12px;display:flex;flex-direction:column}
.side-title{display:flex;justify-content:space-between;color:var(--subtle);font-size:9.5px;
  letter-spacing:.14em;font-weight:700;padding:0 4px 12px}
.pill,.tag{border:1px solid var(--line2);border-radius:4px;padding:2px 6px;font-size:9.5px;
  color:var(--muted);white-space:nowrap}
.search{display:flex;gap:7px;align-items:center;border:1px solid var(--line);border-radius:4px;
  background:var(--panel);height:36px;padding:0 10px;margin-bottom:10px}
.search input{min-width:0;width:100%;background:transparent;border:0;outline:0;color:var(--text);font-size:12px}
.search kbd{border:1px solid var(--line);border-radius:3px;padding:1px 5px;color:var(--subtle);font-size:10px}
.filter{display:block;color:var(--subtle);font-size:11px;margin-bottom:12px}
.filter select{display:block;width:100%;max-width:none;margin-top:5px;padding:6px;border-radius:4px}
.tree{display:flex;flex-direction:column;gap:12px}
.group-label{display:flex;justify-content:space-between;color:var(--subtle);font-size:9.5px;
  font-weight:700;letter-spacing:.08em;padding:4px 5px;text-transform:uppercase}
.link{width:100%;text-align:left;display:flex;gap:8px;align-items:center;background:transparent;
  border:1px solid transparent;color:var(--muted);padding:6px 8px;border-radius:4px;min-height:32px}
.link .num{font:10px ui-monospace,monospace;color:var(--subtle);width:19px;flex:none}
.link .name{font-size:11.5px;flex:1}
.link .done{color:var(--good)}
.link:hover{background:var(--panel2);color:var(--text)}
.link.active{background:var(--panel2);border-color:var(--line2);color:var(--accent)}
.side-foot{margin-top:auto;border-top:1px solid var(--line);padding-top:14px}
.progress-row{display:flex;justify-content:space-between;color:var(--subtle);font-size:10.5px;margin-bottom:7px}
.progress{height:4px;background:var(--panel2);border-radius:2px;overflow:hidden}
.progress>div{height:100%;width:0;background:var(--accent);transition:width .25s}
.side-actions{display:flex;gap:6px;margin-top:12px}
.side-actions .btn{flex:1;padding:6px;font-size:10.5px}

/* ---------- main ---------- */
main{max-width:900px;width:100%;min-width:0;margin:auto;padding:26px 28px 40px}
.breadcrumb{font-size:9.5px;text-transform:uppercase;letter-spacing:.12em;color:var(--subtle);margin-bottom:14px}
.header{padding:2px 2px 20px;border-bottom:1px solid var(--line);margin-bottom:20px}
.eyebrow{font-size:9.5px;text-transform:uppercase;letter-spacing:.13em;font-weight:700;
  color:var(--accent);margin-bottom:8px}
.header h1{font-size:clamp(21px,2.2vw,26px);line-height:1.2;letter-spacing:-.01em;
  margin:0 0 10px;font-weight:600}
.header p{font-size:13px;color:var(--muted);margin:0 0 14px;max-width:700px;line-height:1.6}
.tags{display:flex;flex-wrap:wrap;gap:6px}
.tag.good{color:var(--good)}
.tag.warn{color:var(--warn)}
.header-actions{display:flex;gap:6px;margin-top:14px;flex-wrap:wrap}

/* ---------- panels ---------- */
.panel{border:1px solid var(--line);background:var(--panel);border-radius:var(--radius);
  overflow:hidden;margin-bottom:16px;box-shadow:var(--shadow)}
.panel-head{padding:16px 18px 0}
.panel-head h2{font-size:13px;margin:0 0 4px;letter-spacing:-.005em;font-weight:600}
.panel-head p{font-size:11.5px;color:var(--muted);margin:0;line-height:1.5}
.body{padding:14px 18px 18px}
.idea{display:grid;grid-template-columns:minmax(0,1fr) 200px;gap:18px}
.idea p{font-size:12.5px;color:var(--muted);margin:0 0 12px;line-height:1.65}
.mental{background:var(--panel2);border:1px solid var(--line);border-radius:4px;padding:12px}
.mental small{color:var(--subtle);font-size:9.5px;letter-spacing:.11em;text-transform:uppercase;font-weight:600}
.mental strong{display:block;margin:6px 0;font-size:12px;color:var(--strong);font-weight:600}
.mental p{font-size:11.5px;color:var(--muted);margin:0;line-height:1.6}
.takeaway{padding:10px 12px;border:1px solid var(--line2);background:var(--panel2);
  border-radius:4px;color:var(--text);font-size:12px;line-height:1.6}
.two{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.mini{background:var(--panel2);border:1px solid var(--line);border-radius:4px;padding:12px}
.mini h3{font-size:11.5px;margin:0 0 6px;font-weight:600}
.mini p{font-size:12px;color:var(--muted);margin:0;line-height:1.6}
.steps{counter-reset:s;list-style:none;padding:0;margin:0;display:flex;flex-direction:column;gap:8px}
.steps li{counter-increment:s;display:flex;gap:10px;color:var(--muted);font-size:12px;line-height:1.55}
.steps li:before{content:counter(s);width:22px;height:22px;flex:none;display:grid;place-items:center;
  border:1px solid var(--line2);background:var(--panel2);border-radius:4px;color:var(--accent);
  font:10.5px ui-monospace,monospace}
.pseudo{white-space:pre-wrap;overflow:auto;background:var(--panel2);border:1px solid var(--line);
  border-radius:4px;padding:12px;font:11.5px/1.7 "IBM Plex Mono",ui-monospace,monospace;
  color:var(--text);margin:0}
.table-wrap{overflow:auto}
table{border-collapse:collapse;width:100%;font-size:11.5px}
th,td{border-bottom:1px solid var(--line);text-align:left;padding:8px 10px;vertical-align:top}
th{font-size:9.5px;text-transform:uppercase;letter-spacing:.08em;color:var(--subtle);font-weight:700}
td{color:var(--muted)}
.tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.tile{padding:10px 12px;background:var(--panel2);border:1px solid var(--line);border-radius:4px}
.tile span{display:block;font-size:9.5px;text-transform:uppercase;letter-spacing:.08em;
  color:var(--subtle);font-weight:600}
.tile strong{display:block;color:var(--text);font:600 12.5px "IBM Plex Mono",ui-monospace,monospace;margin-top:5px}
.tile small{font-size:10.5px;color:var(--muted);display:block;margin-top:2px;line-height:1.5}

/* ---------- notices ---------- */
.notice{padding:11px 12px;background:var(--panel2);
  border:1px solid color-mix(in srgb,var(--warn) 40%,var(--line));
  border-radius:4px;font-size:12px;color:var(--muted);line-height:1.6}
.notice strong{color:var(--warn)}
.notice.info{border-color:var(--line2)}
.notice.info strong{color:var(--accent)}

/* ---------- VISUAL LAB STAGE (always dark) ---------- */
.lab-input,.lab-output,.geo-svg{
  --bg:#141110;--panel:#1a1613;--panel2:#1f1a17;--panel3:#1a1613;
  --line:#2a2620;--line2:#3a332c;
  --text:#f5f5f4;--muted:#a8a29e;--subtle:#78716c;
  --accent:#f59e0b;--accent-hover:#d97706;--strong:#fbbf24;
  --good:#10b981;--warn:#f59e0b;--bad:#f87171;
}
.lab-top{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.lab-top label{font-size:11.5px;color:var(--muted)}
.lab-input{width:100%;min-height:100px;resize:vertical;background:#141110;
  border:1px solid #2a2620;border-radius:4px;padding:10px;color:#f5f5f4;
  font:11.5px/1.65 "IBM Plex Mono",ui-monospace,monospace;margin:11px 0}
.lab-output{padding:12px;background:#141110;border:1px solid #2a2620;border-radius:4px;
  min-height:70px;white-space:pre-wrap;overflow-wrap:anywhere;color:#f5f5f4;
  font:11.5px/1.7 "IBM Plex Mono",ui-monospace,monospace;overflow-x:auto}
.lab-cols{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:12px}
.label{font-size:9.5px;color:var(--subtle);font-weight:700;letter-spacing:.1em;
  text-transform:uppercase;margin-bottom:6px}
.geo-svg{width:100%;height:auto;display:block;background:#0f0d0b;
  border:1px solid #2a2620;border-radius:4px;margin:8px 0}

/* ---------- code ---------- */
.code-head{display:flex;gap:8px;align-items:center;justify-content:space-between;flex-wrap:wrap;
  padding:10px 12px;background:var(--panel2);border-bottom:1px solid var(--line)}
.code-editor{display:block;width:100%;min-height:220px;resize:vertical;border:0;border-radius:0;
  background:var(--panel2);color:var(--text);padding:14px;
  font:11.5px/1.7 "IBM Plex Mono",ui-monospace,monospace;outline:0}
.code-editor:focus-visible{outline:2px solid var(--accent);outline-offset:-2px}
.code-foot{display:flex;justify-content:space-between;gap:8px;align-items:center;
  padding:8px 12px;color:var(--subtle);font-size:9.5px;border-top:1px solid var(--line)}
.practice{border:1px solid var(--line);background:var(--panel2);border-radius:4px;padding:12px}
.practice summary{cursor:pointer;font-size:12px;font-weight:600;color:var(--text)}
.practice p{font-size:12px;color:var(--muted);margin:10px 0 0;line-height:1.6}
.references{display:flex;flex-direction:column;gap:7px}
.references a{font-size:12px;overflow-wrap:anywhere;color:var(--accent)}
.references a:hover{color:var(--accent-hover);text-decoration:underline}

/* ---------- home ---------- */
.home-hero{padding:26px;background:var(--panel);border:1px solid var(--line);
  border-radius:var(--radius);margin-bottom:16px}
.home-hero h1{font-size:clamp(24px,2.8vw,30px);line-height:1.15;letter-spacing:-.02em;
  margin:8px 0 14px;font-weight:600}
.home-hero p{color:var(--muted);font-size:13px;max-width:700px;margin:0 0 18px;line-height:1.65}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:16px}
.stat{background:var(--panel);border:1px solid var(--line);border-radius:4px;padding:12px 14px}
.stat strong{display:block;font:600 20px "IBM Plex Mono",ui-monospace,monospace;color:var(--strong)}
.stat span{display:block;font-size:10px;color:var(--muted);margin-top:3px}
.chapter-cards{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.chapter-card{padding:12px;text-align:left;border:1px solid var(--line);border-radius:4px;
  background:var(--panel2);color:var(--text);transition:border-color .15s}
.chapter-card:hover{border-color:var(--accent)}
.chapter-card .num{font-size:9.5px;color:var(--accent);letter-spacing:.09em;font-weight:700}
.chapter-card strong{display:block;font-size:12px;margin:5px 0;font-weight:600;line-height:1.4}
.chapter-card p{font-size:11px;color:var(--muted);margin:0;line-height:1.55}

/* ---------- toast / footer ---------- */
.toast{position:fixed;z-index:99;bottom:20px;left:50%;transform:translate(-50%,10px);opacity:0;
  pointer-events:none;background:var(--panel);border:1px solid var(--line2);border-radius:4px;
  padding:10px 14px;box-shadow:0 4px 16px rgba(0,0,0,.15);font-size:11.5px;
  transition:opacity .14s,transform .14s}
.toast.show{opacity:1;transform:translate(-50%,0)}
.footer{font-size:10px;color:var(--subtle);display:flex;justify-content:space-between;gap:10px;
  flex-wrap:wrap;padding:6px 2px 14px;align-items:center}

/* ---------- responsive ---------- */
@media(max-width:1080px){.layout{grid-template-columns:220px minmax(340px,1fr)}main{padding:22px 20px 32px}}
@media(max-width:840px){
  .topbar{height:auto;min-height:56px;flex-wrap:wrap;gap:8px;padding:10px 14px}
  .top-meta{display:none}
  .top-actions{margin-left:auto}
  .top-actions label{display:none}
  .layout{display:block}
  .sidebar{position:static;height:auto;max-height:none;border:0;border-bottom:1px solid var(--line);padding:12px}
  .tree{max-height:260px;overflow:auto}
  .side-foot{display:none}
  main{padding:18px 14px 32px}
  .idea{grid-template-columns:1fr}
  .mental{order:-1}
  .stats{grid-template-columns:1fr 1fr}
  .chapter-cards,.two,.lab-cols{grid-template-columns:1fr}
}
@media(max-width:520px){
  .brand small{display:none}
  .brand-mark{width:26px;height:26px;font-size:11px}
  .brand strong{font-size:11.5px}
  .top-actions select{max-width:88px;padding:5px;font-size:10px}
  .top-actions .btn{padding:5px 7px;font-size:10px}
  .chapter-cards{grid-template-columns:1fr}
  .tiles{grid-template-columns:1fr}
  .home-hero{padding:18px}
  .home-hero h1{font-size:22px}
  .header h1{font-size:21px}
  .body,.panel-head{padding-left:14px;padding-right:14px}
  .footer{display:block}
  .footer span{display:block;margin-bottom:6px}
}
@media(prefers-reduced-motion:reduce){*,*:before,*:after{scroll-behavior:auto!important;transition:none!important}}
@media print{
  .topbar,.sidebar,.header-actions,.lab-top,.btn,.toast{display:none!important}
  .layout{display:block}
  main{padding:0;max-width:none}
  .panel,.home-hero{break-inside:avoid;box-shadow:none}
  body{background:#fff;color:#111}
  .lab-input,.lab-output{color:#111!important;background:#fff!important;border-color:#ccc!important}
  .geo-svg{background:#f5f5f5!important;border-color:#ccc!important}
}
</style>
</head>
<body>

<header class="topbar">
  <a class="brand" href="#home" id="homeLink"><span class="brand-mark">az</span><span><strong>aznur<span class="brand-sep"> / </span><span class="brand-sub">geometry lab</span></strong><small>COMPUTATIONAL GEOMETRY</small></span></a>
  <div class="top-meta" id="catalogCount"></div>
  <div class="top-actions">
    <label for="themeSelect">Theme</label>
    <select id="themeSelect" aria-label="Theme"><option value="system">System</option><option value="light">Light</option><option value="dark">Dark</option></select>
    <button class="btn" id="printBtn">Print / PDF</button>
    <button class="btn" id="exportBtn">Export</button>
    <button class="btn" id="importBtn">Import</button>
    <input type="file" id="importFile" accept="application/json,.json" hidden>
  </div>
</header>

<div class="layout">
  <aside class="sidebar" aria-label="Course navigation">
    <div class="side-title"><span>COURSE CATALOG</span><span class="pill" id="lessonCount">0</span></div>
    <div class="search"><span>⌕</span><input id="searchInput" type="search" placeholder="Search geometry topics…" aria-label="Search lessons"><kbd>/</kbd></div>
    <label class="filter">Chapter<select id="chapterFilter"><option value="all">All chapters</option></select></label>
    <nav class="tree" id="courseTree" aria-label="Lessons"></nav>
    <div class="side-foot">
      <div class="progress-row"><span>COURSE PROGRESS</span><strong id="progressText">0 / 0</strong></div>
      <div class="progress" id="progressBar"><div id="progressFill"></div></div>
      <div class="side-actions"><button class="btn" data-page="home">Home</button><button class="btn" data-page="progress">Progress</button></div>
    </div>
  </aside>
  <main id="mainView" tabindex="-1" aria-live="polite"></main>
</div>

<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script>
/* ============================================================
   aznur / geometry lab
   ============================================================ */
const CHAPTERS=[
 {id:"primitives",title:"1. Geometric primitives",desc:"Points, vectors, orientation, cross products, distances and robust predicates.",ids:["points-vectors","orientation","distances","robust-predicates"]},
 {id:"segments-polygons",title:"2. Segment and polygon problems",desc:"Line and segment intersection, point-in-polygon, winding numbers and clipping.",ids:["line-intersection","segment-intersection","point-in-polygon","polygon-clipping"]},
 {id:"convex-hulls",title:"3. Convex hulls",desc:"Graham scan, Andrew monotone chain, Jarvis march and Quickhull.",ids:["graham-scan","monotone-chain","jarvis-march","quickhull"]},
 {id:"proximity",title:"4. Proximity and spatial structures",desc:"Nearest pair, k-d trees, range trees, point location and sweep line.",ids:["nearest-pair","kd-trees-geo","range-trees","sweep-line"]},
 {id:"voronoi",title:"5. Voronoi and Delaunay",desc:"Fortune's algorithm, Bowyer-Watson, Delaunay triangulation and Lloyd relaxation.",ids:["fortune","bowyer-watson","delaunay","lloyd-relaxation"]},
 {id:"hull-apps",title:"6. Hull applications",desc:"Rotating calipers, diameter, minimum-area rectangle and Welzl smallest circle.",ids:["rotating-calipers","diameter-minrect","welzl-circle","hull-applications"]},
 {id:"arrangements",title:"7. Advanced regions and arrangements",desc:"Half-plane intersection, line arrangements, alpha shapes and medial axis.",ids:["half-plane-intersection","line-arrangements","alpha-shapes","medial-axis"]},
 {id:"collision",title:"8. Collision and motion geometry",desc:"Separating axis theorem, GJK, EPA, Minkowski sums and continuous collision.",ids:["sat","gjk-epa","minkowski-ccd"]},
 {id:"simplification",title:"9. Simplification and surface extraction",desc:"Douglas-Peucker, marching squares, marching cubes and mesh decimation.",ids:["douglas-peucker","marching-squares","marching-cubes"]},
 {id:"registration",title:"10. Registration, fitting and pathfinding",desc:"RANSAC, ICP, homography, D* Lite, Theta* and Jump Point Search.",ids:["ransac","icp-homography","dstar-lite","jps-theta"]}
];

const D={
 kind:"Concept",status:"Concept lesson",level:2,demo:"none",demoTitle:"Interactive teaching lab",inputKind:"points",refs:[],codeKey:"generic",
 input:"Points, segments, polygons or geometric objects plus the parameters of the method.",
 output:"A predicate, a geometric structure, a partition or an optimal shape.",
 invariant:"The algorithm's correctness relies on a geometric property it exploits. Breaking that property gives wrong answers without an error.",
 complexity:["Depends on the number of input objects","Depends on the data structure","Measure on representative inputs"],
 uses:"Use this as one layer inside a larger geometric pipeline.",
 strength:"Fits the problem it was designed for when its assumptions hold.",
 limits:"Depends on degeneracies, floating point precision and data distribution.",
 pitfall:"A method that works on generic inputs can fail on collinear or duplicate points. Always handle degeneracies.",
 question:"What is the main idea of this lesson?",
 trace:null
};
function mk(o){
 const steps=o.steps||["Read the geometric input.","Apply the algorithm.","Produce the result.","Check correctness."];
 return Object.assign({},D,{
  summary:o.summary||"",
  mental:o.mental||o.title,
  mentalText:o.mentalText||o.summary||"",
  problem:o.problem||("How does "+o.title+" work and when is it the right choice?"),
  steps:steps,
  trace:o.trace||steps.map((s,i)=>["Step "+(i+1),s,i===steps.length-1?"Verified":"Step done"]),
  answer:o.answer||o.summary||"",
  pseudo:o.pseudo||"",
  sample:o.sample||"",
  level:o.level||2
 },o);
}

/* Chapter 1 */

{id:"segment-intersection",title:"All-pairs segment intersection",level:4,kind:"Sweep line",status:"Concept lesson",

 pseudo:"bentley_ottmann(segments):\n  events = []\n  for s in segments:\n    events.append((s.left, 'insert', s))\n    events.append((s.right, 'delete', s))\n  sort events by x, then y\n  active = sorted set by y at current sweep x\n  for (x, type, s) in events:\n    if type == 'insert':\n      active.add(s)\n      check_neighbors(active, s)   # report intersections\n    elif type == 'delete':\n      check_neighbors_after_delete(active, s)\n      active.remove(s)\n\nComplexity: O((n + k) log n)\nn = number of segments, k = number of intersections",

{id:"point-in-polygon",title:"Point in polygon: ray casting and winding",level:3,kind:"Predicate",status:"Runnable teaching lab",
 summary:"Decide whether a point lies inside a simple polygon. Ray casting counts crossings. Winding number counts signed turns and handles self-intersections.",
 mental:"Cast a ray and count how often you cross the boundary",
 mentalText:"From the query point, shoot a ray to infinity. Every boundary crossing flips inside/outside. Odd count means inside.",
 steps:["Pick a ray direction, usually +x.","For each polygon edge, check if it crosses the ray.","Count crossings.","Odd count means inside.","Winding number: sum the signed angles or use the orientation."],
 pseudo:"ray_cast(polygon, p):\n  inside = False\n  for i in range(len(polygon)):\n    a, b = polygon[i], polygon[(i+1) % len(polygon)]\n    if ((a.y > p.y) != (b.y > p.y)):\n      x_intersect = a.x + (p.y - a.y) / (b.y - a.y) * (b.x - a.x)\n      if p.x < x_intersect:\n        inside = not inside\n  return inside\n\nwinding_number(polygon, p):\n  wn = 0\n  for each edge (a, b):\n    if a.y <= p.y:\n      if b.y > p.y and orient(a, b, p) > 0: wn += 1\n    else:\n      if b.y <= p.y and orient(a, b, p) < 0: wn -= 1\n  return wn != 0",
 uses:"Point location, mouse picking, GIS, game engines.",
 strength:"O(n) per query. Simple.",
 limits:"Boundary cases need care. Ray casting on vertices must be consistent.",
 pitfall:"A ray passing exactly through a vertex can be counted twice or zero times. Use half-open rules.",
 question:"For a simple polygon, is the winding number always 0 or 1?",
 answer:"Yes for points inside or outside respectively, assuming counterclockwise ordering.",

{id:"polygon-clipping",title:"Polygon clipping: Sutherland-Hodgman and Weiler-Atherton",level:5,kind:"Algorithm",status:"Concept lesson",
 summary:"Clip a subject polygon by a clip polygon. Sutherland-Hodgman handles convex clippers. Weiler-Atherton handles arbitrary clippers and preserves holes.",
 mental:"Cut a polygon into the part that fits inside a window",

 steps:["For each clip edge:","Walk the subject polygon.","Keep the parts that are on the inside of the clip edge.","Add intersection points at the boundary.","The result is the clipped polygon."],
 pseudo:"sutherland_hodgman(subject, clip):\n  output = subject\n  for each edge (a, b) of clip:\n    input = output\n    output = []\n    for i in range(len(input)):\n      cur = input[i]\n      prev = input[(i-1+len(input)) % len(input)]\n      cur_inside = is_inside(cur, a, b)\n      prev_inside = is_inside(prev, a, b)\n      if cur_inside:\n        if not prev_inside:\n          output.append(intersection(prev, cur, a, b))\n        output.append(cur)\n      elif prev_inside:\n        output.append(intersection(prev, cur, a, b))\n  return output\n\nOnly works for convex clip polygons.\nWeiler-Atherton: arbitrary clip polygons, handles holes.",
 uses:"Computer graphics, GIS, CAD, image processing.",

{id:"graham-scan",title:"Graham scan",level:3,kind:"Convex hull",status:"Runnable teaching lab",
 summary:"Sort points by angle around a pivot, then walk the sorted list maintaining a left turn. O(n log n) dominated by the sort.",
 mental:"Sort by angle and stack the left turns",
 mentalText:"Pick the lowest point as pivot. Sort all others by polar angle. Push points onto a stack, popping when the turn is not counterclockwise.",
 steps:["Find the lowest (and leftmost) pivot.","Sort the other points by angle from the pivot.","Initialize the stack with pivot and the first two points.","For each next point, while the top three make a clockwise turn, pop.","Push the point."],
 pseudo:"graham_scan(points):\n  p0 = min by (y, x)\n  sort points[1:] by polar angle around p0\n  stack = [points[0], points[1]]\n  for p in points[2:]:\n    while len(stack) >= 2 and orient(stack[-2], stack[-1], p) <= 0:\n      stack.pop()\n    stack.append(p)\n  return stack\n\nTime: O(n log n)\nSpace: O(n)\nProduces the hull in counterclockwise order.",
 invariant:"The stack always holds the hull of the points seen so far. Popping keeps the hull convex.",
 uses:"Convex hull, image processing, pattern recognition, path planning.",
 strength:"Simple, O(n log n).",
 limits:"Angular sort is sensitive to ties. Degenerate cases (collinear points) need care.",
 pitfall:"Comparing angles with atan2 is slow and imprecise. Compare using cross product instead.",
 question:"What is the time complexity of Graham scan?",
 answer:"O(n log n) dominated by the angular sort. The scan itself is O(n).",
 demo:"graham",sample:"0 3\n1 1\n2 2\n4 4\n0 0\n1 2\n3 1\n3 3",refs:[
  ["Graham, An efficient algorithm for determining the convex hull of a finite planar set, Information Processing Letters 1972","https://doi.org/10.1016/0020-0190(72)90045-2"],
  ["Preparata and Shamos, Computational Geometry: An Introduction, Springer 1985","https://link.springer.com/book/10.1007/978-1-4612-1098-6"],
  ["O'Rourke, Computational Geometry in C, Section 3.6","https://www.cambridge.org/core/books/computational-geometry-in-c/"]]},
{id:"monotone-chain",title:"Andrew's monotone chain",level:3,kind:"Convex hull",status:"Runnable teaching lab",
 summary:"Andrew's monotone chain sorts points lexicographically and builds the lower and upper hull separately. Simpler and more robust than Graham scan.",
 mental:"Build lower hull then upper hull",
 mentalText:"Sort all points by x then y. Walk left to right building the lower hull. Walk right to left building the upper hull. Concatenate.",
 steps:["Sort points lexicographically.","Build lower hull: walk sorted points, maintain left turns.","Build upper hull: walk reverse sorted points, maintain left turns.","Concatenate and drop the last point of each."],
 pseudo:"monotone_chain(points):\n  points = sorted(points)\n  if len(points) <= 1: return points\n  lower = []\n  for p in points:\n    while len(lower) >= 2 and cross(lower[-2], lower[-1], p) <= 0:\n      lower.pop()\n    lower.append(p)\n  upper = []\n  for p in reversed(points):\n    while len(upper) >= 2 and cross(upper[-2], upper[-1], p) <= 0:\n      upper.pop()\n    upper.append(p)\n  return lower[:-1] + upper[:-1]\n\nTime: O(n log n)\nSpace: O(n)",
 uses:"Convex hull, robust replacement for Graham scan, competitive programming.",
 strength:"No angular sort. Handles collinear points cleanly.",
 limits:"Needs to sort twice (once reversed). Both scans are linear so total is still O(n log n).",
 pitfall:"The <= vs < in the pop condition determines whether collinear points are kept. Pick a convention.",
 question:"How does monotone chain avoid the trigonometric sort of Graham scan?",
 answer:"It uses lexicographic sort by x and y, which is a standard comparison sort. No angles needed.",
 demo:"monotone",sample:"0 3\n1 1\n2 2\n4 4\n0 0\n1 2\n3 1\n3 3",refs:[
  ["Andrew, Another efficient algorithm for convex hulls in two dimensions, Information Processing Letters 1979","https://doi.org/10.1016/0020-0190(79)90072-3"],

{id:"jarvis-march",title:"Jarvis march (gift wrapping)",level:3,kind:"Convex hull",status:"Runnable teaching lab",
 summary:"Start at the lowest point and repeatedly pick the next hull point as the one making the smallest counterclockwise turn. O(nh) where h is the hull size.",
 mental:"Wrap a string around the point set",
 mentalText:"Start at the leftmost point. Each step, find the point that makes the next clockwise turn. Repeat until you return to the start.",
 steps:["Find the leftmost (or lowest) point.","Set current to that point.","Find the point p such that all other points are to the right of current to p.","Move current to p.","Repeat until returning to start."],
 pseudo:"jarvis_march(points):\n  p0 = leftmost point\n  hull = [p0]\n  current = p0\n  while True:\n    next_p = points[0] if points[0] != current else points[1]\n    for p in points:\n      if p == current: continue\n      if orient(current, next_p, p) < 0:   # p is to the right\n        next_p = p\n    if next_p == p0: break\n    hull.append(next_p)\n    current = next_p\n  return hull\n\nTime: O(n * h)\nh = hull size",
 uses:"Convex hull when h is small. Teaching. Output-sensitive algorithms.",
 strength:"Output-sensitive: O(nh). Fast when the hull is small.",
 limits:"O(n²) when all points are on the hull.",
 pitfall:"When several points are collinear with the current edge, choose the farthest one to avoid adding interior points.",
 question:"When is Jarvis march faster than Graham scan?",
 answer:"When h is much smaller than n. Then O(nh) beats O(n log n).",
 demo:"jarvis",sample:"0 3\n1 1\n2 2\n4 4\n0 0\n1 2\n3 1\n3 3",refs:[

{id:"quickhull",title:"Quickhull",level:4,kind:"Convex hull",status:"Runnable teaching lab",

 pseudo:"quickhull(points):\n  if len(points) <= 2: return points\n  a = leftmost(points)\n  b = rightmost(points)\n  return [a] + quickhull(points on one side of a,b) + [b] + quickhull(points on other side)\n\nquickhull_side(a, b, points):\n  if not points: return []\n  c = farthest point from line ab\n  left = points left of ac\n  right = points left of cb\n  return quickhull_side(a, c, left) + [c] + quickhull_side(c, b, right)\n\nAverage time: O(n log n)\nWorst case: O(n^2) when points are adversarial",

{id:"nearest-pair",title:"Closest pair of points",level:4,kind:"Divide and conquer",status:"Runnable teaching lab",
 summary:"Find the two closest points in a set. Divide and conquer gives O(n log n). The strip check across the divide is the key step.",
 mental:"Split, recurse, check the strip",
 mentalText:"Sort by x. Split into halves. Recurse both sides. Combine by checking points within the current best distance of the split line.",
 steps:["Sort points by x.","Divide into left and right halves.","Recursively find the min distance in each half.","Take the smaller delta.","Sort points in the strip of width 2*delta by y.","For each point, check the next few points in the strip."],
 pseudo:"closest_pair(points):\n  points = sorted by x\n  return rec(points)\n\nrec(points):\n  if len(points) <= 3:\n    return brute force min distance\n  mid = len(points) // 2\n  mid_x = points[mid].x\n  d_left = rec(points[:mid])\n  d_right = rec(points[mid:])\n  d = min(d_left, d_right)\n  strip = [p for p in points if abs(p.x - mid_x) < d]\n  strip.sort(key=lambda p: p.y)\n  for i in range(len(strip)):\n    for j in range(i+1, min(i+8, len(strip))):\n      d = min(d, dist(strip[i], strip[j]))\n  return d\n\nTime: O(n log n)",
 uses:"Collision detection, clustering, computational biology, graphics.",
 strength:"O(n log n) deterministic. Exact.",
 limits:"Implementation is subtle. The strip check must not be missed.",
 pitfall:"Forgetting to sort the strip by y makes the algorithm O(n²) instead of O(n log n).",
 question:"Why is the strip check at most 7 comparisons per point?",
 answer:"The packing argument: at most 8 points can fit in a delta x 2*delta rectangle without two being closer than delta.",
 demo:"closest-pair",sample:"0 0\n5 5\n1 1\n6 6\n3 4\n7 8\n9 2",refs:[
  ["Shamos and Hoey, Closest-point problems, FOCS 1975","https://doi.org/10.1109/SFCS.1975.8"],

{id:"kd-trees-geo",title:"k-d trees for geometric queries",level:4,kind:"Spatial index",status:"Runnable teaching lab",
 summary:"A k-d tree splits space by alternating axes. It supports nearest neighbour, range search and point location in low dimensions.",
 mental:"Divide space with axis-aligned cuts",
 mentalText:"At each level, split the points by one axis at the median. Recurse on the two halves.",
 steps:["Choose the axis (alternating).","Find the median on that axis.","Recurse on left and right.","For queries, prune subtrees whose bounding box is too far."],
 pseudo:"build(points, depth):\n  if not points: return None\n  axis = depth % k\n  points.sort(by axis)\n  mid = len(points) // 2\n  return Node(\n    point=points[mid],\n    left=build(points[:mid], depth+1),\n    right=build(points[mid+1:], depth+1),\n    axis=axis,\n  )\n\nnearest(root, q):\n  best = None\n  def visit(node):\n    if not node: return\n    if dist(node.point, q) < best.dist: best = node.point\n    axis = node.axis\n    first = node.left if q[axis] < node.point[axis] else node.right\n    second = node.right if q[axis] < node.point[axis] else node.left\n    visit(first)\n    if abs(q[axis] - node.point[axis]) < best.dist:\n      visit(second)\n  visit(root)\n  return best",
 uses:"Nearest neighbour, range search, ray tracing, point location in low dimensions.",
 strength:"Works in any dimension. Simple extension of binary search.",
 limits:"Curse of dimensionality: degrades to linear scan above ~20 dimensions.",
 pitfall:"Choosing the axis at random or by split-spread gives better balance on skewed data.",
 question:"At what dimension does a k-d tree stop being useful?",
 answer:"Around 20. Above that, almost every point must be checked because pruning fails.",
 demo:"kd-tree-geo",sample:"2 3\n5 4\n9 6\n4 7\n8 1\n7 2\n\n5 5",refs:[
  ["Bentley, Multidimensional binary search trees used for associative searching, CACM 1975","https://doi.org/10.1145/361002.361007"],
  ["Friedman, Bentley, Finkel, An algorithm for finding best matches in logarithmic expected time, ACM TOMS 1977","https://doi.org/10.1145/355744.355745"],
  ["Samet, Foundations of Multidimensional and Metric Data Structures","https://www.sciencedirect.com/book/9780123694461/foundations-of-multidimensional-and-metric-data-structures"]]},
{id:"range-trees",title:"Range trees and orthogonal range search",level:5,kind:"Spatial index",status:"Concept lesson",
 summary:"A range tree answers orthogonal range queries in O(log² n + k) time with O(n log n) space. Each level is a balanced BST over one coordinate.",
 mental:"A tree of trees over coordinates",
 mentalText:"First tree splits by x. Each node holds a secondary tree over y. Query walks x and consults the y-trees.",
 steps:["Build a balanced BST on x.","Each node holds a sorted list or BST of the points in its subtree, keyed by y.","For a query rectangle, find O(log n) canonical nodes on x.","In each, find O(log n + k) points on y."],
 pseudo:"build(points, depth=0):\n  if not points: return None\n  axis = depth % 2\n  sort by axis\n  mid = len(points) // 2\n  node = Node(point=points[mid])\n  node.left = build(points[:mid], depth+1)\n  node.right = build(points[mid+1:], depth+1)\n  node.assoc = sorted list or BST on y of all points in subtree\n  return node\n\nquery(node, rect):\n  if node is None: return\n  if node.point in rect: report node.point\n  if rect intersects left region: query(node.left, rect)\n  if rect intersects right region: query(node.right, rect)\n\nTime: O(log^2 n + k)\nSpace: O(n log n)",
 uses:"GIS, database indexing, geometric databases, computational statistics.",
 strength:"Sub-linear orthogonal range queries.",
 limits:"O(n log n) space. Higher dimensions cost O(log^d n).",
 pitfall:"The space grows fast with dimension. Fractional cascading reduces the query time to O(log n + k).",
 question:"What is the query time of a 2D range tree?",
 answer:"O(log² n + k) where k is the number of reported points.",
 demo:"none",sample:"",refs:[
  ["Bentley, Decomposable searching problems, Information Processing Letters 1979","https://doi.org/10.1016/0020-0190(79)90117-0"],
  ["Lueker, A data structure for orthogonal range queries, FOCS 1978","https://doi.org/10.1109/SFCS.1978.1"],

{id:"sweep-line",title:"Sweep line paradigm",level:4,kind:"Paradigm",status:"Concept lesson",
 summary:"Sweep line processes geometric events in sorted order along one axis. It converts many O(n²) problems into O(n log n) by maintaining a status structure.",
 mental:"Move a vertical line across the plane",
 mentalText:"At each event, update a data structure that holds the current slice of the objects. Answer queries as the line moves.",
 steps:["Define events (start, end, crossing, ...).","Sort events by primary coordinate.","Maintain a status structure for the current slice.","Process events in order, updating the structure."],
 pseudo:"sweep(objects):\n  events = collect_events(objects)\n  events.sort(by primary coordinate)\n  status = empty ordered set\n  for e in events:\n    handle_event(e, status)\n  return results\n\nClassic applications:\n  segment intersection (Bentley-Ottmann): O((n+k) log n)\n  rectangle union area: O(n log n)\n  closest pair: O(n log n)\n  convex hull of points\n  Voronoi diagram (Fortune): O(n log n)\n  computing visibilities\n  map overlay",
 uses:"Everything that can be solved by sweeping. Fundamental paradigm.",
 strength:"Converts O(n²) to O(n log n) for many problems.",
 limits:"Event handling is subtle. Degenerate cases need careful attention.",
 pitfall:"The choice of sweep direction and event ordering determines the algorithm. Getting them right is half the work.",
 question:"What is the status structure in a segment intersection sweep?",
 answer:"The ordered set of segments currently crossing the sweep line, ordered by y at the current x.",
 demo:"none",sample:"",refs:[
  ["de Berg et al., Computational Geometry, Chapter 2","https://link.springer.com/book/10.1007/978-3-540-77974-2"],
  ["Preparata and Shamos, Computational Geometry: An Introduction, Chapter 1","https://link.springer.com/book/10.1007/978-1-4612-1098-6"],

{id:"fortune",title:"Fortune's algorithm",level:5,kind:"Voronoi",status:"Concept lesson",
 summary:"Fortune's algorithm computes the Voronoi diagram in O(n log n) using a sweep line and a parabolic beach line. The beach line is the boundary between fixed sites and unprocessed space.",
 mental:"Sweep a line and track the beach line of parabolas",
 mentalText:"The sweep line advances. Processed sites define parabolas that form the beach line. Voronoi edges appear where parabolas meet.",
 steps:["Sweep line moves top to bottom.","Maintain a balanced tree of parabola arcs on the beach line.","Site events: a new parabola appears, splitting an arc.","Circle events: three parabolas converge, creating a Voronoi vertex.","Edges are traced as the sweep advances."],
 pseudo:"fortune(sites):\n  events = priority queue of site and circle events\n  for s in sites: push(site_event(s.x, s))\n  beach_line = balanced tree of arcs\n  while events not empty:\n    e = events.pop_min()\n    if e is site_event:\n      handle_site(e, beach_line, events)\n    elif e is circle_event:\n      handle_circle(e, beach_line, events)\n  return voronoi_diagram\n\nTime: O(n log n)\nSpace: O(n)\nHandle degeneracies: coincident sites, cocircular triples.",
 uses:"Voronoi diagrams, spatial analysis, mesh generation, nearest neighbour queries.",
 strength:"Optimal O(n log n).",
 limits:"Complex to implement. Robust predicates essential.",
 pitfall:"Degenerate cases (three or more cocircular sites) cause multiple circle events at the same point. Must be handled.",
 question:"What is the beach line in Fortune's algorithm?",
 answer:"The set of parabolic arcs at the intersection of the current sweep line's influence and the already-processed sites.",
 demo:"none",sample:"",refs:[
  ["Fortune, A sweepline algorithm for Voronoi diagrams, Algorithmica 1987","https://doi.org/10.1007/BF01840357"],
  ["de Berg et al., Computational Geometry, Chapter 7","https://link.springer.com/book/10.1007/978-3-540-77974-2"],

{id:"bowyer-watson",title:"Bowyer-Watson Delaunay triangulation",level:5,kind:"Delaunay",status:"Runnable teaching lab",
 summary:"Bowyer-Watson builds the Delaunay triangulation incrementally. It inserts points one at a time, removing triangles whose circumcircle contains the new point.",
 mental:"Insert points, fix the circumcircle violations",
 mentalText:"Add a new point. Find all triangles whose circumcircle contains it. Remove them. Retriangulate the hole.",
 steps:["Start with a super-triangle containing all points.","For each point p:","Find triangles whose circumcircle contains p.","Remove them, leaving a star-shaped hole.","Connect p to the boundary of the hole.","Remove triangles touching the super-triangle."],
 pseudo:"bowyer_watson(points):\n  triangulation = [super_triangle(points)]\n  for p in points:\n    bad = [t for t in triangulation if in_circumcircle(t, p)]\n    polygon = boundary_edges(bad)\n    triangulation = [t for t in triangulation if t not in bad]\n    for edge in polygon:\n      triangulation.append(Triangle(edge.a, edge.b, p))\n  triangulation = [t for t in triangulation if not touches_super(t)]\n  return triangulation\n\nTime: O(n^2) naive\nWith good point location and edge flipping: O(n log n) expected.",
 uses:"Terrain modeling, mesh generation, interpolation, computer graphics.",
 strength:"Simple to describe. Good practical performance.",
 limits:"Naive implementation is O(n²). Needs robust incircle predicate.",
 pitfall:"The super-triangle must be large enough. Too small breaks the cocircular detection.",
 question:"What is the Delaunay condition for a triangle?",
 answer:"No other point lies strictly inside the triangle's circumcircle.",
 demo:"delaunay",sample:"0 0\n1 0\n0 1\n1 1\n0.5 0.5\n0.3 0.7\n0.7 0.3",refs:[
  ["Bowyer, Computing Dirichlet tessellations, Computer Journal 1981","https://doi.org/10.1093/comjnl/24.2.162"],
  ["Watson, Computing the n-dimensional Delaunay tessellation with application to Voronoi polytopes, Computer Journal 1981","https://doi.org/10.1093/comjnl/24.2.167"],

{id:"delaunay",title:"Delaunay triangulation properties",level:5,kind:"Delaunay",status:"Concept lesson",
 summary:"The Delaunay triangulation maximizes the minimum angle among all triangulations. It is dual to the Voronoi diagram and is unique for points in general position.",
 mental:"The triangulation that avoids skinny triangles",
 mentalText:"Among all triangulations of the same points, Delaunay has the 'fattest' triangles. Every triangle's circumcircle contains no other point.",
 steps:["Compute the Delaunay triangulation.","Recover the Voronoi diagram as the dual.","Use the empty circumcircle property for many algorithms.","Use it for interpolation, mesh generation, terrain."],
 pseudo:"Properties:\n  - Every triangle's circumcircle contains no other point\n  - Maximizes the minimum angle (avoids skinny triangles)\n  - Dual to the Voronoi diagram\n  - Unique up to cocircular quadruples\n  - Contains the Euclidean MST\n  - Contains the convex hull edges\n\nComplexity:\n  O(n log n) with divide and conquer\n  O(n log n) expected with randomized incremental\n  O(n log log n) with sophisticated methods\n\nDegenerate cases:\n  cocircular points cause multiple valid triangulations\n  use symbolic perturbation to break ties",
 uses:"Mesh generation, terrain modeling, interpolating data, computing Voronoi diagrams, alpha shapes.",
 strength:"Optimal triangles, many theoretical properties.",
 limits:"Requires robust incircle predicate. Degeneracies need care.",
 pitfall:"Non-unique for cocircular points. Choose a consistent tie-breaking rule.",
 question:"What makes Delaunay triangles 'nice' for mesh generation?",
 answer:"They maximize the minimum angle, so no triangle is too skinny. This makes them good elements for finite element methods.",
 demo:"none",sample:"",refs:[

{id:"lloyd-relaxation",title:"Lloyd relaxation",level:4,kind:"Delaunay",status:"Runnable teaching lab",
 summary:"Lloyd relaxation iteratively moves each site to the centroid of its Voronoi cell. It produces evenly-spaced points and is used for mesh smoothing and generating blue noise.",
 mental:"Move each site to the center of its cell, repeat",
 mentalText:"Compute the Voronoi diagram. For each cell, compute its centroid. Move the site there. Repeat.",
 steps:["Place initial sites.","Compute Voronoi diagram.","For each cell, compute its centroid.","Move the site to the centroid.","Repeat until convergence."],
 pseudo:"lloyd(points, iterations):\n  for _ in range(iterations):\n    voronoi = compute_voronoi(points)\n    for i, cell in enumerate(voronoi.cells):\n      points[i] = centroid(cell)\n  return points\n\nConverges to a centroidal Voronoi tessellation (CVT).\nProduces well-spaced points (blue noise).\n",
 uses:"Mesh generation, texture generation, point distribution, stippling, imaging.",
 strength:"Simple iterative improvement. Produces visually pleasing results.",
 limits:"Slow convergence. Each iteration is O(n log n).",
 pitfall:"Cells at the boundary of the domain must be handled carefully. Clipping the diagram to a bounding region is common.",
 question:"What is a centroidal Voronoi tessellation?",
 answer:"A Voronoi diagram where each site coincides with the centroid of its cell. Lloyd relaxation converges to it.",

{id:"rotating-calipers",title:"Rotating calipers",level:5,kind:"Optimization",status:"Concept lesson",
 summary:"Rotating calipers traverse the convex hull with two parallel supporting lines. This solves diameter, width, minimum rectangle, and closest pair problems in O(n) after the hull is computed.",
 mental:"Two parallel rulers rotating around the hull",
 mentalText:"Place two parallel lines tangent to the hull. Rotate them together. The sequence of hull vertices they touch gives all antipodal pairs.",
 steps:["Compute the convex hull.","Start with an edge of the hull as a supporting line.","Find the antipodal vertex on the opposite side.","Rotate to the next edge.","Track the antipodal vertex.","Report all antipodal pairs, then compute the metric."],
 pseudo:"rotating_calipers(hull):\n  n = len(hull)\n  j = 1\n  for i in range(n):\n    while area(hull[i], hull[(i+1)%n], hull[(j+1)%n]) > area(hull[i], hull[(i+1)%n], hull[j]):\n      j = (j + 1) % n\n    report antipodal pair (i, j)\n\nApplications:\n  - diameter: max distance between antipodal pairs\n  - width: minimum of max distance from a line\n  - minimum-area rectangle: side lengths from antipodal pairs\n  - minimum-perimeter rectangle\n  - convex polygon intersection\n\nTime: O(n) after hull.",
 uses:"Hull analysis, bounding box, shape orientation, robot path planning.",
 strength:"Linear after the hull. Many metrics from one pass.",
 limits:"Only on convex polygons.",
 pitfall:"Degeneracies (parallel edges) need careful handling to avoid missing pairs.",
 question:"How many antipodal pairs can a convex polygon have?",
 answer:"At most n pairs for n vertices. The rotating calipers traversal is linear.",
 demo:"calipers",sample:"0 0\n4 0\n4 3\n2 5\n0 3",refs:[
  ["Toussaint, Solving geometric problems with the rotating calipers, 1983","https://www.cs.mcgill.ca/~cs507/projects/1998/jacob/paper.pdf"],
  ["Shamos, Computational Geometry, PhD thesis, Yale 1978","https://en.wikipedia.org/wiki/Rotating_calipers"],
  ["Preparata and Shamos, Computational Geometry: An Introduction, Section 4","https://link.springer.com/book/10.1007/978-1-4612-1098-6"]]},
{id:"diameter-minrect",title:"Diameter and minimum enclosing rectangle",level:4,kind:"Application",status:"Runnable teaching lab",
 summary:"The diameter of a point set is the largest distance between two points. The minimum-area enclosing rectangle can be found via rotating calipers on the hull.",
 mental:"Widest pair and tightest box",
 mentalText:"Diameter is the farthest pair. The minimum enclosing rectangle has one side flush with a hull edge.",
 steps:["Compute the convex hull.","Rotating calipers to find antipodal pairs.","Diameter: max over antipodal pairs.","Minimum rectangle: for each hull edge, project all points onto the edge and its perpendicular.","Take the minimum area over all edges."],
 pseudo:"diameter(hull):\n  best = 0\n  for each antipodal pair (i, j):\n    best = max(best, dist(hull[i], hull[j]))\n  return best\n\nminimum_rectangle(hull):\n  best_area = infinity\n  for each edge (i, i+1):\n    edge_dir = hull[i+1] - hull[i]\n    perp = (-edge_dir.y, edge_dir.x)\n    min_x, max_x, min_y, max_y = project all points\n    area = (max_x - min_x) * (max_y - min_y)\n    best_area = min(best_area, area)\n  return best_area\n\nTime: O(n^2) naive\nWith rotating calipers: O(n)",
 uses:"Bounding box, computer vision, image analysis, molecular geometry.",
 strength:"Exact. Small code.",
 limits:"O(n²) naive. Use rotating calipers for O(n).",
 pitfall:"The minimum rectangle has a side flush with a hull edge. Not obvious but true.",
 question:"Is the minimum-area enclosing rectangle always flush with a hull edge?",
 answer:"Yes. This is the key theorem that makes the rotating-calipers method work.",
 demo:"diameter-rect",sample:"0 0\n4 0\n4 3\n2 5\n0 3",refs:[
  ["Freeman and Shapira, Determining the minimum-area encasing rectangle for an arbitrary closed curve, CACM 1975","https://doi.org/10.1145/360881.360919"],
  ["Toussaint, Solving geometric problems with the rotating calipers, 1983","https://www.cs.mcgill.ca/~cs507/projects/1998/jacob/paper.pdf"],
  ["Preparata and Shamos, Computational Geometry: An Introduction","https://link.springer.com/book/10.1007/978-1-4612-1098-6"]]},
{id:"welzl-circle",title:"Welzl smallest enclosing circle",level:5,kind:"Randomized",status:"Runnable teaching lab",
 summary:"The smallest enclosing circle of a point set is determined by 2 or 3 points. Welzl's algorithm finds it in expected O(n) with a simple randomized incremental scheme.",
 mental:"Grow the circle, fix violations with boundary points",
 mentalText:"Process points one at a time. If a point is outside the circle, it must be on the boundary. Recurse with a smaller set and more boundary constraints.",
 steps:["Shuffle the points.","Process points one at a time.","Maintain a circle containing all processed points.","If a new point is inside, continue.","If outside, the new point is on the boundary.","Recurse with the new point fixed."],
 pseudo:"welzl(points, R=[]):\n  if not points or len(R) == 3:\n    return trivial_circle(R)\n  p = points[0]\n  D = welzl(points[1:], R)\n  if p in D: return D\n  return welzl(points[1:], R + [p])\n\nBase cases:\n  R = 0: any circle\n  R = 1: point circle\n  R = 2: circle through two points\n  R = 3: circle through three points\n\nExpected time: O(n)\nWorst case: O(n^3) but rare",
 uses:"Bounding shapes, computational geometry, clustering (min enclosing circle), facility location.",
 strength:"Expected O(n). Simple recursion.",
 limits:"Randomized. Needs a robust 3-point circumcircle.",
 pitfall:"Recursion is easiest but Python's default depth limit is a problem. Use iterative or increase the limit.",
 question:"How many points can determine the smallest enclosing circle?",
 answer:"Two (diameter) or three (circumcircle). Never more.",
 demo:"welzl",sample:"0 0\n4 0\n4 3\n2 5\n0 3",refs:[
  ["Welzl, Smallest enclosing disks (balls and ellipsoids), 1991","https://doi.org/10.1007/BFb0038202"],

{id:"half-plane-intersection",title:"Half-plane intersection",level:5,kind:"Region",status:"Concept lesson",
 summary:"The intersection of half-planes is a convex polygon. Computed in O(n log n) via sort by angle and a deque, or in O(n) if the planes are already sorted.",
 mental:"Stack constraints and keep the feasible region",
 mentalText:"Each half-plane says 'stay on this side'. Sort them by angle. Intersect them one at a time, popping when the boundary is empty.",
 steps:["Convert each half-plane to its bounding line and direction.","Sort by angle.","Intersect with a deque, popping obsolete planes from both ends.","The result is a convex polygon."],
 pseudo:"half_plane_intersection(halfplanes):\n  halfplanes.sort(by angle)\n  deque = []\n  for hp in halfplanes:\n    while len(deque) >= 2 and not is_left(deque[-1], deque[-2], hp):\n      deque.pop()\n    while len(deque) >= 2 and not is_left(deque[0], deque[1], hp):\n      deque.popleft()\n    deque.append(hp)\n  while len(deque) >= 2 and not is_left(deque[-1], deque[-2], deque[0]):\n    deque.pop()\n  while len(deque) >= 2 and not is_left(deque[0], deque[1], deque[-1]):\n    deque.popleft()\n  return intersection_points(deque)\n\nTime: O(n log n) with sort\nSpace: O(n)\nDetect empty intersection.",
 uses:"Linear programming in low dimension, Voronoi cells, feasible regions, computational geometry primitives.",
 strength:"Exact for convex regions. O(n log n).",
 limits:"Only for half-planes in 2D. Higher dimensions are harder.",
 pitfall:"Parallel half-planes need careful ordering. Robust orientation is essential.",
 question:"What is the intersection of half-planes geometrically?",
 answer:"A convex polygon (possibly unbounded, empty, or a single point).",
 demo:"none",sample:"",refs:[

{id:"line-arrangements",title:"Line arrangements",level:5,kind:"Structure",status:"Concept lesson",
 summary:"An arrangement of n lines partitions the plane into O(n²) faces, edges and vertices. It is the fundamental structure for many geometric computations.",
 mental:"Cut the plane with lines and study the cells",

 steps:["Identify all lines.","Compute pairwise intersections.","Sort along each line to get the arrangement.","Use the structure for queries."],

{id:"alpha-shapes",title:"Alpha shapes",level:5,kind:"Shape reconstruction",status:"Concept lesson",
 summary:"An alpha shape generalizes the convex hull. Each alpha value gives a piece of the shape. Small alpha gives the point set; large alpha gives the hull.",
 mental:"Carve the shape with a disk of radius 1/alpha",
 mentalText:"Roll a disk of radius 1/alpha around the point set. Where the disk cannot enter, the shape is solid. As alpha increases, the shape shrinks.",
 steps:["Compute the Delaunay triangulation.","For each triangle, check whether its circumradius is ≤ 1/alpha.","For each edge, check whether the boundary circles fit.","Keep the triangles and edges that pass.","Result is the alpha shape."],
 pseudo:"alpha_shape(points, alpha):\n  triangulation = delaunay(points)\n  shape = []\n  for triangle t in triangulation:\n    if circumradius(t) <= 1/alpha:\n      shape.append(t)\n  for edge e in triangulation:\n    if circle_boundary_fits(e, alpha):\n      shape.append(e)\n  return shape\n\nAlpha = 0: point set\nAlpha = infinity: convex hull\nAlpha varies smoothly.\n\nComplexity: O(n log n) given the Delaunay triangulation.",
 uses:"Shape reconstruction, surface reconstruction, computational topology, point cloud analysis.",
 strength:"Smoothly connects points to hull. Topologically meaningful.",
 limits:"Requires alpha tuning. Only for well-sampled data.",
 pitfall:"Alpha must be chosen carefully. Wrong alpha gives either disconnected points or the full hull.",
 question:"What does alpha = 0 produce?",
 answer:"The point set with no triangles. Only the points remain.",
 demo:"none",sample:"",refs:[
  ["Edelsbrunner, Kirkpatrick, Seidel, On the shape of a set of points in the plane, IEEE TIT 1983","https://doi.org/10.1109/TIT.1983.1056714"],

{id:"medial-axis",title:"Medial axis and skeleton",level:5,kind:"Structure",status:"Concept lesson",
 summary:"The medial axis is the set of points with more than one closest point on the boundary. It captures the shape's skeleton and is used for shape analysis and simplification.",
 mental:"The backbone of a shape",
 mentalText:"Imagine a grass fire starting from the boundary of a shape. The medial axis is where the fire fronts meet.",
 steps:["Compute the Voronoi diagram of the boundary.","The medial axis is the internal Voronoi edges.","Prune short branches for simplification.","Use for shape matching, animation, or simplification."],
 pseudo:"medial_axis(polygon):\n  sample boundary → points P\n  voronoi = compute_voronoi(P)\n  medial_axis = [edges of voronoi inside the polygon]\n  return medial_axis\n\nProperties:\n  preserves topology\n  encodes the shape's thickness (via distance to boundary)\n  has branches\n\nApplications:\n  shape matching\n  path planning (keep the robot's center on the axis)\n  character animation (skeleton)\n  mesh simplification",
 uses:"Shape analysis, computer graphics, robotics, medical imaging.",
 strength:"Captures the essential structure of a shape.",
 limits:"Sensitive to boundary noise. Pruning needs heuristics.",
 pitfall:"The medial axis of a polygon with many vertices is complex. Simplify before computing.",
 question:"What does the medial axis look like for a rectangle?",

{id:"sat",title:"Separating Axis Theorem (SAT)",level:4,kind:"Collision",status:"Runnable teaching lab",
 summary:"Two convex shapes do not collide if and only if there is an axis along which their projections do not overlap. For polygons, only the edge normals need testing.",
 mental:"Find a direction where the shadows don't overlap",
 mentalText:"Project both shapes onto various axes. If any axis has non-overlapping projections, they are separated.",
 steps:["Collect candidate axes: edge normals of both polygons.","For each axis, project both polygons onto the axis.","If the projections do not overlap, no collision.","If all axes overlap, collision."],
 pseudo:"sat(polygon_a, polygon_b):\n  for each edge of A:\n    axis = perpendicular(edge)\n    if not overlap(project(A, axis), project(B, axis)):\n      return False\n  for each edge of B:\n    axis = perpendicular(edge)\n    if not overlap(project(A, axis), project(B, axis)):\n      return False\n  return True\n\n2D: O(n + m) per test\n3D: needs cross products of edge pairs too",
 uses:"2D and 3D collision detection, game physics, UI hit testing.",
 strength:"Simple, fast for convex shapes.",
 limits:"Only works for convex shapes. Concave shapes need decomposition.",
 pitfall:"Axes must include the edge normals of both polygons. Missing one gives false positives.",
 question:"How many candidate axes are needed in 2D?",
 answer:"One per edge of each polygon. For two n-gons, 2n axes.",
 demo:"sat",sample:"0 0\n2 0\n2 2\n0 2\n\n1.5 0\n3.5 0\n3.5 2\n1.5 2\n\n5 5\n7 5\n7 7\n5 7",refs:[
  ["Gottschalk, Lin, Manocha, OBBTree: A hierarchical structure for rapid interference detection, SIGGRAPH 1996","https://doi.org/10.1145/237170.237244"],
  ["Ericson, Real-Time Collision Detection, Chapter 4","https://www.sciencedirect.com/book/9781558607323/real-time-collision-detection"],
  ["Wikipedia, Hyperplane separation theorem","https://en.wikipedia.org/wiki/Hyperplane_separation_theorem"]]},
{id:"gjk-epa",title:"GJK and EPA",level:5,kind:"Collision",status:"Concept lesson",
 summary:"GJK tests if two convex shapes intersect using the Minkowski difference and a simplex of support points. EPA (Expanding Polytope Algorithm) finds the penetration depth.",
 mental:"Search for the origin inside the Minkowski difference",
 mentalText:"Two shapes intersect if the origin is inside their Minkowski difference. GJK iteratively builds a simplex that converges toward (or contains) the origin.",
 steps:["Compute the Minkowski difference's support point in a direction.","Build a simplex (point, segment, triangle, tetrahedron) that moves toward the origin.","If the origin is contained, shapes intersect.","Otherwise, no collision.","EPA: expand the simplex to find the closest face to the origin."],
 pseudo:"gjk(shape_a, shape_b):\n  direction = arbitrary\n  simplex = []\n  while True:\n    p = support(shape_a, shape_b, direction)\n    if dot(p, direction) < 0: return False  # no collision\n    simplex.append(p)\n    if handle_simplex(simplex, direction): return True\n\nevaluate direction to move toward the origin.\nUpdate simplex (point → segment → triangle → tetrahedron).\n\nEPA:\n  use GJK result as starting simplex\n  expand toward the closest face\n  return penetration depth and direction\n\nComplexity: O(n + m) per iteration, few iterations in practice.",
 uses:"Physics engines, robotics, game collision, real-time graphics.",
 strength:"Fast for convex shapes. Works in 2D and 3D.",
 limits:"Only convex shapes. EPA can be numerically delicate.",
 pitfall:"GJK termination conditions require care. Infinite loops happen with degenerate inputs.",
 question:"What does GJK use instead of testing all edges?",
 answer:"It uses support functions to iteratively narrow down the region containing the origin in the Minkowski difference.",
 demo:"none",sample:"",refs:[
  ["Gilbert, Johnson, Keerthi, A fast procedure for computing the distance between complex objects in three-dimensional space, IEEE J. Robotics 1988","https://doi.org/10.1109/56.2083"],
  ["Bergen, A fast and robust GJK implementation for collision detection of convex objects, JGT 1999","https://doi.org/10.1080/10867651.1999.10487502"],
  ["Ericson, Real-Time Collision Detection, Chapter 9","https://www.sciencedirect.com/book/9781558607323/real-time-collision-detection"]]},
{id:"minkowski-ccd",title:"Minkowski sums and continuous collision",level:5,kind:"Motion",status:"Concept lesson",
 summary:"The Minkowski sum of two shapes is the set of all points that are the sum of one point from each. It simplifies many problems. Continuous collision detection uses swept volumes.",
 mental:"Add every point of one shape to every point of another",
 mentalText:"The Minkowski sum of a point and a shape is the translated shape. Of two shapes it is the 'swept' region. Collisions and time-of-impact reduce to this.",
 steps:["For collision, compute the Minkowski difference: A - B.","Collision iff the origin is in A - B.","For motion, compute the swept volume.","Test the sweep against obstacles."],
 pseudo:"Minkowski sum A + B = {a + b : a in A, b in B}\nMinkowski difference A - B = {a - b : a in A, b in B}\n\nCollision test:\n  A and B collide iff 0 in (A - B)\n\nContinuous collision (linear motion):\n  A(t) = A0 + t*v\n  find smallest t such that A(t) and B collide\n  equivalent to ray casting from A0 - B toward -v in the Minkowski sum\n\nTime of impact = minimal t with collision",
 uses:"Robotics, physics simulation, path planning, motion planning.",
 strength:"Unifies many collision and motion problems.",
 limits:"Minkowski sums are expensive in general. Only for convex shapes is it simple.",
 pitfall:"Degenerate shapes and numerical precision need attention.",
 question:"What is the Minkowski sum of two unit squares centered at the origin?",
 answer:"A 2x2 square centered at the origin. The sum of every point in one square with every point in the other.",
 demo:"none",sample:"",refs:[
  ["O'Rourke, Computational Geometry in C, Chapter 7","https://www.cambridge.org/core/books/computational-geometry-in-c/"],
  ["Ericson, Real-Time Collision Detection, Section 5.5","https://www.sciencedirect.com/book/9781558607323/real-time-collision-detection"],
  ["Wikipedia, Minkowski addition","https://en.wikipedia.org/wiki/Minkowski_addition"]]},

{id:"douglas-peucker",title:"Douglas-Peucker simplification",level:3,kind:"Simplification",status:"Runnable teaching lab",
 summary:"Simplify a polyline by removing vertices that do not affect the shape significantly. Keep the endpoints, find the farthest vertex, recurse on both halves.",
 mental:"Keep the corners, drop the straights",
 mentalText:"Draw a line between the endpoints. The farthest point from that line is kept. Recurse on the two halves.",
 steps:["Draw a line from the first to the last vertex.","Find the vertex farthest from the line.","If the distance is below the tolerance, drop all interior vertices.","Otherwise keep that vertex and recurse on both halves."],
 pseudo:"douglas_peucker(points, epsilon):\n  if len(points) < 3: return points\n  keep = []\n  dmax = 0\n  index = 0\n  for i in range(1, len(points) - 1):\n    d = perpendicular_distance(points[i], points[0], points[-1])\n    if d > dmax: dmax = d; index = i\n  if dmax > epsilon:\n    left = douglas_peucker(points[:index+1], epsilon)\n    right = douglas_peucker(points[index:], epsilon)\n    return left[:-1] + right\n  else:\n    return [points[0], points[-1]]\n\nTime: O(n log n) average, O(n^2) worst case\nSpace: O(n) for the recursion",
 uses:"Map simplification, GPS trace compression, shape simplification, digital cartography.",
 strength:"Simple and effective. Preserves the shape's character.",
 limits:"Not optimal (does not minimize the number of vertices).",
 pitfall:"Epsilon must be tuned. Too large drops important features.",
 question:"What does the Douglas-Peucker algorithm preserve?",
 answer:"The key corners of the polyline. Points that are nearly on a straight line are dropped.",
 demo:"douglas-peucker",sample:"0 0\n1 0.5\n2 0.1\n3 1.2\n4 0.3\n5 0.8\n6 0.1\n7 1.5\n8 0.2\n9 0\n\n0.3",refs:[
  ["Douglas and Peucker, Algorithms for the reduction of the number of points required to represent a digitized line or its caricature, Cartographica 1973","https://doi.org/10.3138/FM57-6770-U75U-7727"],
  ["Hershberger and Snoeyink, Speeding up the Douglas-Peucker line-simplification algorithm, 1992","https://doi.org/10.1145/141903.141931"],
  ["Wikipedia, Ramer-Douglas-Peucker algorithm","https://en.wikipedia.org/wiki/Ramer%E2%80%93Douglas%E2%80%93Peucker_algorithm"]]},
{id:"marching-squares",title:"Marching squares",level:4,kind:"Surface extraction",status:"Runnable teaching lab",
 summary:"Extract iso-contours from a 2D scalar field. Marching squares processes each cell of a grid, using a lookup table to emit line segments for the contour.",
 mental:"Draw the level set on a grid cell by cell",
 mentalText:"Each grid cell has 4 corners with values. Compare to the iso-value. The pattern of above/below determines which edges the contour crosses.",
 steps:["For each grid cell, form a 4-bit mask from above/below the iso-value.","Look up the contour segments for that mask.","Interpolate along the edges for exact positions.","Connect segments across cells."],
 pseudo:"marching_squares(grid, iso_value):\n  segments = []\n  for each cell (i, j):\n    mask = (top_left > iso) << 3 |\n           (top_right > iso) << 2 |\n           (bottom_right > iso) << 1 |\n           (bottom_left > iso)\n    if mask == 0 or mask == 15: continue  # all above or all below\n    for edge in contour_table[mask]:\n      p = interpolate(edge, cell, iso_value)\n      segments.append(p)\n  return segments\n\n16 possible masks\nAmbiguous cases (5, 10): choose consistent topology\n3D: 256 masks (marching cubes)",
 uses:"Isosurface extraction, terrain mapping, fluid simulation, medical imaging.",
 strength:"Simple. Runs in O(cells).",
 limits:"Ambiguous cases need careful handling. Grid resolution limits accuracy.",
 pitfall:"The ambiguous mask 5 and 10 can be resolved two ways. Choose based on the surrounding cells or use a saddle-point value.",
 question:"How many grid corners are used per cell in marching squares?",
 answer:"Four. The mask is a 4-bit number (0-15).",
 demo:"marching",sample:"10",refs:[
  ["Lorensen and Cline, Marching cubes: A high resolution 3D surface construction algorithm, SIGGRAPH 1987","https://doi.org/10.1145/37401.37422"],
  ["Maple, Geometric design and space planning using the marching squares and marching cube algorithms, 2003","https://doi.org/10.1109/GMAP.2003.1219675"],

{id:"marching-cubes",title:"Marching cubes and mesh decimation",level:5,kind:"Surface extraction",status:"Concept lesson",
 summary:"Marching cubes extends marching squares to 3D. It extracts triangle meshes from volumetric data. Mesh decimation reduces the number of triangles while preserving shape.",
 mental:"3D isosurface from voxel data",
 mentalText:"For each cube of 8 voxels, look up which triangle configuration matches the inside/outside pattern. Emit triangles. Then simplify.",
 steps:["For each voxel cube, compute the inside/outside mask.","Look up the triangle configuration.","Interpolate vertex positions.","Combine triangles from adjacent cubes.","Optionally decimate the mesh."],
 pseudo:"marching_cubes(volume, iso_value):\n  triangles = []\n  for each cube in volume:\n    mask = 0\n    for k in range(8):\n      if volume[cube.corner[k]] > iso_value: mask |= (1 << k)\n    if mask == 0 or mask == 255: continue\n    for tri in tri_table[mask]:\n      vertices = [interpolate(edge, cube, iso)\n                  for edge in tri]\n      triangles.append(vertices)\n  return triangles\n\n256 possible masks\n15 base configurations\nProduces 0 to 5 triangles per cube",
 uses:"Medical imaging (CT, MRI), terrain, fluid simulation, scientific visualization.",
 strength:"Standard algorithm. Handles complex surfaces.",
 limits:"Ambiguous cases. Memory for large volumes.",
 pitfall:"Vertex deduplication is important. Without it, adjacent triangles do not share vertices, giving a fragmented mesh.",
 question:"How many triangle configurations does marching cubes have?",
 answer:"15 base configurations with symmetry. 256 raw masks.",
 demo:"none",sample:"",refs:[
  ["Lorensen and Cline, Marching cubes, SIGGRAPH 1987","https://doi.org/10.1145/37401.37422"],
  ["Chernyaev, Marching cubes 33: Construction of topologically correct isosurfaces, 1995","http://www.mcc.uiuc.edu/papers/1995/mc33.pdf"],

{id:"ransac",title:"RANSAC",level:4,kind:"Fitting",status:"Runnable teaching lab",
 summary:"RANSAC fits a model to data with outliers by randomly sampling minimal subsets, fitting a model, and counting inliers. Iterate to find the model with the most support.",
 mental:"Random guesses, keep the one with the most agreement",
 mentalText:"Pick the minimum number of points to define a model. Fit. Count inliers within a tolerance. Repeat. Keep the best.",
 steps:["Choose a minimal subset size.","Sample a minimal subset at random.","Fit the model.","Count inliers within a tolerance.","Keep the best model.","Iterate for a fixed number of rounds."],
 pseudo:"ransac(data, model, n, k, t, d):\n  best_model = None\n  best_inliers = 0\n  for iteration in range(k):\n    sample = random sample of n points\n    model = fit(sample)\n    inliers = [p for p in data if distance(p, model) < t]\n    if len(inliers) > best_inliers:\n      best_inliers = len(inliers)\n      best_model = model\n  # refit on all inliers\n  best_model = fit(best_inliers)\n  return best_model, best_inliers\n\nIterations k = log(1 - p) / log(1 - w^n)\np = desired success probability\nw = inlier ratio\nn = minimal sample size\n\nFor w = 0.5, n = 2, p = 0.99: k ~ 16",
 uses:"Line and circle fitting with outliers, homography estimation, fundamental matrix, plane detection.",
 strength:"Handles large outlier ratios. Simple.",
 limits:"Non-deterministic. Needs enough iterations.",
 pitfall:"The threshold t is critical. Too small misses inliers, too large accepts outliers.",
 question:"How many iterations are needed for 50% inliers and 2-point models with 99% success?",
 answer:"k = log(0.01) / log(1 - 0.25) ≈ 16 iterations.",
 demo:"ransac",sample:"0 0\n1 0.9\n2 2.1\n3 3.2\n4 3.8\n5 5.1\n10 10\n15 0.1\n0.5 5\n\n0.5",refs:[
  ["Fischler and Bolles, Random sample consensus: a paradigm for model fitting with applications in image analysis and automated cartography, CACM 1981","https://doi.org/10.1145/358669.358692"],
  ["Hartley and Zisserman, Multiple View Geometry in Computer Vision, Cambridge 2004","https://www.cambridge.org/core/books/multiple-view-geometry-in-computer-vision/"],
  ["Wikipedia, Random sample consensus","https://en.wikipedia.org/wiki/Random_sample_consensus"]]},
{id:"icp-homography",title:"ICP and homography estimation",level:5,kind:"Registration",status:"Concept lesson",
 summary:"ICP aligns two point clouds by alternating between finding nearest correspondences and computing the best rigid transform. Homography estimation aligns two images under a planar transform.",
 mental:"Match points, compute transform, repeat",
 mentalText:"Given two point sets, iterate: for each point in A, find the nearest in B. Compute the transform. Move A. Repeat until convergence.",
 steps:["Initialize with a rough alignment.","For each source point, find the nearest target point.","Compute the transform minimizing squared distances.","Apply the transform.","Repeat until convergence."],
 pseudo:"icp(source, target, max_iter):\n  T = identity\n  for _ in range(max_iter):\n    # find correspondences\n    pairs = []\n    for p in source:\n      q = nearest_neighbor(T @ p, target)\n      pairs.append((p, q))\n    # compute rigid transform (Procrustes / SVD)\n    T = compute_rigid(pairs)\n  return T\n\nHomography:\n  given 4+ point correspondences\n  solve for 3x3 matrix H (up to scale)\n  use DLT with SVD\n  RANSAC for robust estimation\n\nApplications:\n  point cloud registration\n  stereo vision\n  image stitching\n  SLAM",
 uses:"Robotics, 3D reconstruction, image stitching, augmented reality.",
 strength:"Simple and effective when initialization is good.",
 limits:"Local optimum. Needs decent initialization. Nearest neighbour is sensitive to outliers.",
 pitfall:"ICP can get stuck in local minima. Global registration methods (RANSAC + features) are needed for large misalignments.",
 question:"What is the main limitation of ICP?",
 answer:"It converges to the nearest local minimum. If the initial alignment is too far off, it converges to the wrong transform.",
 demo:"none",sample:"",refs:[
  ["Besl and McKay, A method for registration of 3-D shapes, IEEE TPAMI 1992","https://doi.org/10.1109/34.121791"],
  ["Zhang, Iterative point matching for registration of free-form curves and surfaces, IJCV 1994","https://doi.org/10.1007/BF01427149"],
  ["Hartley and Zisserman, Multiple View Geometry in Computer Vision, Chapter 4","https://www.cambridge.org/core/books/multiple-view-geometry-in-computer-vision/"]]},
{id:"dstar-lite",title:"D* Lite and dynamic replanning",level:5,kind:"Pathfinding",status:"Concept lesson",
 summary:"D* Lite is a fast replanning algorithm for robots in changing environments. It computes a shortest path, then repairs it when edge costs change without recomputing from scratch.",
 mental:"Repair the path when the map changes",
 mentalText:"Maintain a priority queue of inconsistent nodes. When an edge cost changes, update its endpoints and propagate the change. The path is repaired locally.",
 steps:["Initialize with the initial map and goal.","Compute the shortest path to the goal (like A* backwards).","Move along the path.","When the map changes, update edge costs.","Repair the affected nodes.","Continue."],
 pseudo:"d_star_lite(start, goal):\n  g = {goal: 0}\n  rhs = {goal: 0}\n  open = priority queue\n  while True:\n    if start's g == rhs and start not in open:\n      # optimal\n      break\n    k_old = open.top_key()\n    u = open.pop()\n    # ... update g and rhs based on neighbors\n    # ... propagate changes\n  # move along gradient descent\n  # when map changes, update edge costs and re-insert affected nodes\n\nFaster than replanning from scratch after every change.",
 uses:"Robot navigation, game AI, dynamic path planning, vehicle routing.",
 strength:"Efficient when the map changes slowly.",
 limits:"Complex implementation. Priority queue keys must be maintained carefully.",
 pitfall:"The key computation must be consistent across update and pop. Bugs lead to suboptimal or failed replanning.",
 question:"Why is D* Lite faster than recomputing A* after every change?",
 answer:"It reuses information from the previous plan. Only the affected parts of the path are recomputed.",
 demo:"none",sample:"",refs:[
  ["Koenig and Likhachev, D* Lite, AAAI 2002","https://www.aaai.org/Papers/AAAI/2002/AAAI02-072.pdf"],
  ["Stentz, Optimal and efficient path planning for partially-known environments, ICRA 1994","https://doi.org/10.1109/ROBOT.1994.351061"],

{id:"jps-theta",title:"Jump Point Search and Theta*",level:5,kind:"Pathfinding",status:"Runnable teaching lab",
 summary:"Jump Point Search (JPS) speeds up A* on uniform grids by jumping over symmetric paths. Theta* relaxes the grid constraint and allows any-angle paths.",
 mental:"Skip symmetric paths and cut corners",
 mentalText:"On a grid, many paths are equivalent. JPS skips them by jumping from one forced neighbor to the next. Theta* allows diagonal shortcuts.",
 steps:["JPS: from a node, prune symmetric successors.","Jump in each direction until a forced neighbor or goal is found.","Recurse using jump points as successors.","Theta*: allow any-angle moves.","Update a node's parent to a grandparent if the straight line is clear."],
 pseudo:"JPS:\n  for each direction:\n    jump recursively:\n      if goal: return\n      if forced neighbor exists: return current\n      continue jumping\n\nTheta*:\n  relax neighbors\n  for each neighbor s of current node s':\n    if line_of_sight(parent(s'), s):\n      if g(parent(s')) + dist(parent(s'), s) < g(s):\n        parent(s) = parent(s')\n        update g(s)\n    else:\n      standard A* relaxation\n\nJPS: up to 30x faster on uniform-cost grids\nTheta*: shorter paths on grids by allowing any-angle moves",
 uses:"Game AI, robot navigation, RTS games, logistics.",
 strength:"JPS is very fast on uniform grids. Theta* produces near-optimal any-angle paths.",
 limits:"JPS assumes uniform cost. Theta* needs line-of-sight tests.",
 pitfall:"Both require careful successor rules. Bugs give suboptimal paths.",
 question:"What is a forced neighbor in JPS?",
 answer:"A neighbor that cannot be reached from the parent by any other path. Forced neighbors define jump points.",
