/* ============================================================
   Utilities
   ============================================================ */
function parsePoints(text){
 const lines=text.trim().split(/\n/).filter(l=>l.trim()&&!l.startsWith('#'));
 const points=[];
 for(const l of lines){
  const p=l.trim().split(/[\s,]+/).filter(Boolean).map(Number);
  if(p.length>=2&&p.every(Number.isFinite))points.push([p[0],p[1]]);
 }
 if(!points.length)throw Error('Enter points, one per line as "x y".');
 return points;
}
function parsePointsAndNumber(text){
 const blocks=text.trim().split(/\n\s*\n/);
 if(blocks.length>=2){
  return {points:parsePoints(blocks[0]),num:parseFloat(blocks[1].trim())||0};
 }
 const lines=text.trim().split(/\n/);
 const last=lines.pop().trim();
 if(/^-?\d+(\.\d+)?$/.test(last)){
  return {points:parsePoints(lines.join('\n')),num:parseFloat(last)};
 }
 return {points:parsePoints(text),num:0};
}
function fmtNum(x,d=3){
 if(!Number.isFinite(x))return String(x);
 if(Math.abs(x)<1e-12)return '0';
 if(Math.abs(x)>=1e5||Math.abs(x)<1e-3)return x.toExponential(d-1);
 return parseFloat(x.toFixed(d)).toString();
}
function svgPlot(width,height,inner){
 return `<svg class="geo-svg" viewBox="0 0 ${width} ${height}" xmlns="http://www.w3.org/2000/svg">${inner}</svg>`;
}
function bbox(points,pad=40,width=700,height=400){
 const xs=points.map(p=>p[0]),ys=points.map(p=>p[1]);
 const minX=Math.min(...xs),maxX=Math.max(...xs);
 const minY=Math.min(...ys),maxY=Math.max(...ys);
 const spanX=maxX-minX||1,spanY=maxY-minY||1;
 const scale=Math.min((width-pad*2)/spanX,(height-pad*2)/spanY);
 const offX=(width-spanX*scale)/2-minX*scale;
 const offY=(height-spanY*scale)/2-minY*scale;
 const tx=x=>x*scale+offX;
 const ty=y=>height-(y*scale+offY);
 return {tx,ty,scale};
}

 function cross(o,a,b){return (a[0]-o[0])*(b[1]-o[1])-(a[1]-o[1])*(b[0]-o[0])}
 const pts=[...points].sort((a,b)=>a[0]-b[0]||a[1]-b[1]);

 let best=null,bestD=0;

  encoded:`Convex hull size: ${hull.length}\nDiameter: ${fmtNum(bestD)}\nBetween (${best[0]}) and (${best[1]})`,
  html:svgPlot(700,400,svg),
  decoded:`Diameter of a point set = maximum distance. It is achieved at a pair of antipodal hull vertices. Rotating calipers finds it in O(h) after the hull.`

function demoDiameterRect(text){

 if(points.length<2)throw Error('Enter at least 2 points.');
 function cross(o,a,b){return (a[0]-o[0])*(b[1]-o[1])-(a[1]-o[1])*(b[0]-o[0])}
 const pts=[...points].sort((a,b)=>a[0]-b[0]||a[1]-b[1]);
 const lower=[];
 for(const p of pts){while(lower.length>=2&&cross(lower[lower.length-2],lower[lower.length-1],p)<=0)lower.pop();lower.push(p)}
 const upper=[];
 for(const p of [...pts].reverse()){while(upper.length>=2&&cross(upper[upper.length-2],upper[upper.length-1],p)<=0)upper.pop();upper.push(p)}

 let bestArea=Infinity,bestRect=null;
 for(let i=0;i<hull.length;i++){
  const a=hull[i],b=hull[(i+1)%hull.length];
  const dx=b[0]-a[0],dy=b[1]-a[1];
  const L=Math.hypot(dx,dy);
  const ux=dx/L,uy=dy/L;

   minV=Math.min(minV,v);maxV=Math.max(maxV,v);

 }

function demoWelzl(text){
 const points=parsePoints(text);
 if(points.length<1)throw Error('Enter at least 1 point.');
 function circle2(a,b){return [(a[0]+b[0])/2,(a[1]+b[1])/2,Math.hypot(a[0]-b[0],a[1]-b[1])/2]}
 function circle3(a,b,c){
  const ax=a[0],ay=a[1],bx=b[0],by=b[1],cx=c[0],cy=c[1];
  const d=2*(ax*(by-cy)+bx*(cy-ay)+cx*(ay-by));
  if(Math.abs(d)<1e-12)return circle2(a,b);
  const ux=((ax*ax+ay*ay)*(by-cy)+(bx*bx+by*by)*(cy-ay)+(cx*cx+cy*cy)*(ay-by))/d;
  const uy=((ax*ax+ay*ay)*(cx-bx)+(bx*bx+by*by)*(ax-cx)+(cx*cx+cy*cy)*(bx-ax))/d;
  return [ux,uy,Math.hypot(ax-ux,ay-uy)];
 }
 function inside(c,p){return Math.hypot(p[0]-c[0],p[1]-c[1])<=c[2]+1e-9}
 function rec(pts,R){
  if(!pts.length||R.length===3){
   if(R.length===0)return[0,0,0];
   if(R.length===1)return[R[0][0],R[0][1],0];
   if(R.length===2)return circle2(R[0],R[1]);
   return circle3(R[0],R[1],R[2]);
  }
  const p=pts[0];
  const D=rec(pts.slice(1),R);
  if(inside(D,p))return D;
  return rec(pts.slice(1),[...R,p]);
 }
 const shuffled=[...points].sort(()=>Math.random()-0.5);
 const c=rec(shuffled,[]);
 const {tx,ty}=bbox(points,60);
 let svg='';
 for(const p of points)svg+=`<circle cx="${tx(p[0])}" cy="${ty(p[1])}" r="4" fill="var(--muted)"/>`;
 const scale=(tx(1)-tx(0));
 svg+=`<circle cx="${tx(c[0])}" cy="${ty(c[1])}" r="${c[2]*scale}" fill="none" stroke="var(--accent)" stroke-width="2"/>`;
 for(const p of points)if(Math.hypot(p[0]-c[0],p[1]-c[1])>c[2]-1e-6)svg+=`<circle cx="${tx(p[0])}" cy="${ty(p[1])}" r="7" fill="var(--good)"/>`;
 return {
  encoded:`Smallest enclosing circle\nCenter: (${fmtNum(c[0])}, ${fmtNum(c[1])})\nRadius: ${fmtNum(c[2])}\n\nDetermined by 2 or 3 boundary points.`,
  html:svgPlot(700,400,svg),
  decoded:`Welzl's algorithm: randomized incremental construction. Each new point that is outside the current circle becomes a boundary constraint. Expected O(n).`
 };
}
function demoSat(text){
 const blocks=text.trim().split(/\n\s*\n/);
 const polys=[];
 for(const blk of blocks){
  const pts=parsePoints(blk);
  if(pts.length>=3)polys.push(pts);
 }
 if(polys.length<2)throw Error('Enter two polygons separated by a blank line.');
 function project(poly,axis){
  const ds=poly.map(p=>p[0]*axis[0]+p[1]*axis[1]);
  return [Math.min(...ds),Math.max(...ds)];
 }
 function axes(p){
  const out=[];
  for(let i=0;i<p.length;i++){
   const a=p[i],b=p[(i+1)%p.length];
   const dx=b[0]-a[0],dy=b[1]-a[1];
   out.push([-dy,dx]);
  }
  return out;
 }
 function overlaps(a,b){return !(a[1]<b[0]||b[1]<a[0])}
 let separated=false;
 let separatingAxis=null;
 const allAxes=[...axes(polys[0]),...axes(polys[1])];
 for(const ax of allAxes){
  const p1=project(polys[0],ax);
  const p2=project(polys[1],ax);
  if(!overlaps(p1,p2)){separated=true;separatingAxis=ax;break}
 }
 const allPts=polys.flat();
 const {tx,ty}=bbox(allPts,60);
 let svg='';
 for(const poly of polys){
  svg+=`<polygon points="${poly.map(p=>`${tx(p[0])},${ty(p[1])}`).join(' ')}" fill="${poly===polys[0]?'var(--accent)':'var(--warn)'}" opacity="0.25" stroke="${poly===polys[0]?'var(--accent)':'var(--warn)'}" stroke-width="2"/>`;
  for(const p of poly)svg+=`<circle cx="${tx(p[0])}" cy="${ty(p[1])}" r="4" fill="var(--text)"/>`;
 }
 if(separatingAxis){
  const cx=(Math.min(...allPts.map(p=>p[0]))+Math.max(...allPts.map(p=>p[0])))/2;
  const cy=(Math.min(...allPts.map(p=>p[1]))+Math.max(...allPts.map(p=>p[1])))/2;
  const L=1000;
  const dx=separatingAxis[0],dy=separatingAxis[1];
  const norm=Math.hypot(dx,dy);
  svg+=`<line x1="${tx(cx-dx/norm*L)}" y1="${ty(cy-dy/norm*L)}" x2="${tx(cx+dx/norm*L)}" y2="${ty(cy+dy/norm*L)}" stroke="var(--bad)" stroke-width="1.5" stroke-dasharray="6,4"/>`;
 }
 return {
  encoded:`SAT collision test:\n  ${separated?'SEPARATED (no collision)':'OVERLAPPING (collision)'}\n${separatingAxis?`  Separating axis: (${fmtNum(separatingAxis[0])}, ${fmtNum(separatingAxis[1])})`:''}`,
  html:svgPlot(700,400,svg),
  decoded:`SAT projects both polygons onto candidate axes. If any axis has disjoint projections, the shapes do not collide. Red dashed line = separating axis.`
 };
}
function demoDouglasPeucker(text){
 const parts=parsePointsAndNumber(text);
 const points=parts.points;
 const eps=parts.num||0.3;
 function perpDist(p,a,b){
  if(a[0]===b[0]&&a[1]===b[1])return Math.hypot(p[0]-a[0],p[1]-a[1]);
  const t=((p[0]-a[0])*(b[0]-a[0])+(p[1]-a[1])*(b[1]-a[1]))/(Math.pow(b[0]-a[0],2)+Math.pow(b[1]-a[1],2));
  const tc=Math.max(0,Math.min(1,t));
  const proj=[a[0]+tc*(b[0]-a[0]),a[1]+tc*(b[1]-a[1])];
  return Math.hypot(p[0]-proj[0],p[1]-proj[1]);
 }
 function dp(pts){
  if(pts.length<3)return pts;
  let dmax=0,idx=0;
  for(let i=1;i<pts.length-1;i++){
   const d=perpDist(pts[i],pts[0],pts[pts.length-1]);
   if(d>dmax){dmax=d;idx=i}
  }
  if(dmax>eps){
   const left=dp(pts.slice(0,idx+1));
   const right=dp(pts.slice(idx));
   return left.slice(0,-1).concat(right);
  }
  return [pts[0],pts[pts.length-1]];
 }
 const simplified=dp(points);
 const {tx,ty}=bbox(points,50);
 let svg=`<polyline points="${points.map(p=>`${tx(p[0])},${ty(p[1])}`).join(' ')}" fill="none" stroke="var(--muted)" stroke-width="1.5"/>`;
 svg+=`<polyline points="${simplified.map(p=>`${tx(p[0])},${ty(p[1])}`).join(' ')}" fill="none" stroke="var(--accent)" stroke-width="2.5"/>`;
 for(const p of points)svg+=`<circle cx="${tx(p[0])}" cy="${ty(p[1])}" r="3" fill="var(--muted)"/>`;
 for(const p of simplified)svg+=`<circle cx="${tx(p[0])}" cy="${ty(p[1])}" r="6" fill="var(--good)"/>`;
 return {
  encoded:`Original points: ${points.length}\nSimplified: ${simplified.length}\nEpsilon: ${eps}\n\nKept:\n${simplified.map(p=>`  (${p})`).join('\n')}`,
  html:svgPlot(700,300,svg),
  decoded:`Douglas-Peucker keeps the endpoints and the farthest vertex. Green dots = kept vertices.`
 };
}
function demoMarching(text){
 const n=Math.max(5,Math.min(parseInt(text.trim())||10,25));
 const grid=[];
 let s=42;
 const rnd=()=>{s=(s*1103515245+12345)&0x7fffffff;return s/0x7fffffff};
 for(let i=0;i<n;i++){grid.push([]);for(let j=0;j<n;j++)grid[i].push(Math.sin(i*0.7)+Math.cos(j*0.5)+rnd()*0.3)}
 const iso=1.0;
 const segments=[];
 const cell=40;
 const w=n*cell+40,h=n*cell+40;
 const tx=i=>i*cell+20,ty=j=>j*cell+20;
 for(let i=0;i<n-1;i++)for(let j=0;j<n-1;j++){
  const tl=grid[i][j]>iso,tr=grid[i][j+1]>iso,br=grid[i+1][j+1]>iso,bl=grid[i+1][j]>iso;
  const mask=(tl?8:0)|(tr?4:0)|(br?2:0)|(bl?1:0);
  if(mask===0||mask===15)continue;
  const edges=[
   [[tx(j+0.5),ty(i)],[tx(j+1),ty(i+0.5)]],
   [[tx(j+1),ty(i+0.5)],[tx(j+0.5),ty(i+1)]],
   [[tx(j+0.5),ty(i+1)],[tx(j),ty(i+0.5)]],
   [[tx(j),ty(i+0.5)],[tx(j+0.5),ty(i)]],
  ];
  const frac=Math.abs(iso-((grid[i][j]+grid[i+1][j+1])/2));
  if(frac>0.02){
   if((tl!==br)||(tr!==bl)){
    const e1=edges[mask%4],e2=edges[(mask+2)%4];
    segments.push([e1[0],e2[1]]);
   }
  }
 }
 let svg='';
 for(let i=0;i<n;i++)for(let j=0;j<n;j++){
  const v=Math.max(0,Math.min(1,(grid[i][j]+1)/3));
  svg+=`<rect x="${tx(j)}" y="${ty(i)}" width="${cell}" height="${cell}" fill="hsl(${30+v*20},${50+v*20}%,${22+v*55}%)"/>`;
 }
 for(const[s1,s2]of segments){
  svg+=`<line x1="${s1[0]}" y1="${s1[1]}" x2="${s2[0]}" y2="${s2[1]}" stroke="var(--accent)" stroke-width="2"/>`;
 }
 return {
  encoded:`Grid: ${n} by ${n}\nIso-value: ${iso}\nContour segments: ${segments.length}`,
  html:svgPlot(w,h,svg),
  decoded:`Marching squares: for each grid cell, compare corners to the iso-value. Emit contour segments for edges that cross. Amber lines = contour.`
 };
}
function demoRansac(text){
 const parts=parsePointsAndNumber(text);
 const points=parts.points;
 const threshold=parts.num||0.5;
 function fitLine(p1,p2){
  const x1=p1[0],y1=p1[1],x2=p2[0],y2=p2[1];
  const a=y2-y1,b=x1-x2,c=-(a*x1+b*y1);
  return [a,b,c];
 }
 function dist(p,line){
  const[a,b,c]=line;
  return Math.abs(a*p[0]+b*p[1]+c)/Math.hypot(a,b);
 }
 let bestModel=null,bestInliers=[];
 let s=42;
 const rnd=()=>{s=(s*1103515245+12345)&0x7fffffff;return s/0x7fffffff};
 for(let it=0;it<100;it++){
  const i=Math.floor(rnd()*points.length);
  let j=Math.floor(rnd()*points.length);
  while(j===i)j=Math.floor(rnd()*points.length);
  const model=fitLine(points[i],points[j]);
  const inliers=points.filter(p=>dist(p,model)<threshold);
  if(inliers.length>bestInliers.length){bestInliers=inliers;bestModel=model}
 }
 const {tx,ty}=bbox(points,50);
 let svg='';
 for(const p of points){
  const isIn=bestInliers.includes(p);
  svg+=`<circle cx="${tx(p[0])}" cy="${ty(p[1])}" r="4" fill="${isIn?'var(--good)':'var(--bad)'}"/>`;
 }
 if(bestModel){
  const[a,b,c]=bestModel;
  let x1,y1,x2,y2;
  if(Math.abs(b)>Math.abs(a)){
   y1=Math.min(...points.map(p=>p[1]));
   y2=Math.max(...points.map(p=>p[1]));
   x1=-(b*y1+c)/a;
   x2=-(b*y2+c)/a;
  }else{
   x1=Math.min(...points.map(p=>p[0]));
   x2=Math.max(...points.map(p=>p[0]));
   y1=-(a*x1+c)/b;
   y2=-(a*x2+c)/b;
  }
  svg+=`<line x1="${tx(x1)}" y1="${ty(y1)}" x2="${tx(x2)}" y2="${ty(y2)}" stroke="var(--accent)" stroke-width="2"/>`;
 }
 return {
  encoded:`RANSAC line fit\nPoints: ${points.length}\nInliers: ${bestInliers.length} (${(bestInliers.length/points.length*100).toFixed(1)}%)\nThreshold: ${threshold}\n\nFitted line: ${bestModel.map(v=>fmtNum(v)).join('x + ')} = 0`,
  html:svgPlot(700,400,svg),
  decoded:`RANSAC samples minimal subsets, fits a model, and counts inliers. Amber = fitted line, green = inliers, red = outliers.`
 };
}
function demoJps(text){
 const lines=text.trim().split(/\n/);
 const dims=lines[0].split(/\s+/).map(Number);
 const R=dims[0]||15,C=dims[1]||15;
 const start=(lines[1]||'0 0').split(/\s+/).map(Number);
 const goal=(lines[2]||`${R-1} ${C-1}`).split(/\s+/).map(Number);
 const obstacles=[];
 for(let i=3;i<lines.length;i++){
  const parts=lines[i].split(/\s+/).map(Number);
  if(parts.length===4){
   for(let r=parts[0];r<=parts[2];r++)for(let c=parts[1];c<=parts[3];c++)obstacles.push([r,c]);
  }
 }
 const grid=Array.from({length:R},()=>new Array(C).fill(0));
 for(const[r,c]of obstacles)if(r>=0&&r<R&&c>=0&&c<C)grid[r][c]=1;
 const q=[[start[0],start[1],[[start[0],start[1]]]]];
 const seen=new Set([start[0]+','+start[1]]);
 let path=null;
 while(q.length){
  const[r,c,p]=q.shift();
  if(r===goal[0]&&c===goal[1]){path=p;break}
  for(const[dr,dc]of[[-1,0],[1,0],[0,-1],[0,1]]){
   const nr=r+dr,nc=c+dc;
   if(nr<0||nr>=R||nc<0||nc>=C||grid[nr][nc]===1)continue;
   const k=nr+','+nc;
   if(seen.has(k))continue;
   seen.add(k);
   q.push([nr,nc,p.concat([[nr,nc]])]);
  }
 }
 const cell=Math.min(600/Math.max(R,C),30);
 const w=C*cell+20,h=R*cell+20;
 const tx=c=>c*cell+10,ty=r=>r*cell+10;
 let svg='';
 for(let r=0;r<R;r++)for(let c=0;c<C;c++){
  const color=grid[r][c]===1?'var(--bad)':'var(--panel3)';
  svg+=`<rect x="${tx(c)}" y="${ty(r)}" width="${cell}" height="${cell}" fill="${color}" stroke="var(--line)" stroke-width="0.5"/>`;
 }
 if(path){
  for(const[r,c]of path){
   svg+=`<rect x="${tx(c)+2}" y="${ty(r)+2}" width="${cell-4}" height="${cell-4}" fill="var(--accent)" opacity="0.5"/>`;
  }
 }
 svg+=`<circle cx="${tx(start[1])+cell/2}" cy="${ty(start[0])+cell/2}" r="4" fill="var(--good)"/>`;
 svg+=`<circle cx="${tx(goal[1])+cell/2}" cy="${ty(goal[0])+cell/2}" r="4" fill="var(--warn)"/>`;
 return {
  encoded:`Grid: ${R} × ${C}\nStart: (${start})\nGoal: (${goal})\nObstacles: ${obstacles.length}\n\nPath length: ${path?path.length:'no path'}`,
  html:svgPlot(w,h,svg),
  decoded:`Grid pathfinding with obstacles. Jump Point Search would prune symmetric paths, but this demo uses standard BFS.`
 };
}

function runLab(l,initial){
 const input=$('#labInput').value;
 let res;
 try{
  if(!initial){$('#labEncoded').textContent='Running…';$('#labDecoded').textContent=''}
  switch(l.demo){
   case'points':res=demoPoints(input);break;
   case'orientation':res=demoOrientation(input);break;
   case'distances':res=demoDistances(input);break;
   case'segments':res=demoSegments(input);break;
   case'point-in-poly':res=demoPointInPoly(input);break;
   case'graham':res=demoGraham(input);break;
   case'monotone':res=demoMonotone(input);break;
   case'jarvis':res=demoJarvis(input);break;
   case'quickhull':res=demoQuickhull(input);break;
   case'closest-pair':res=demoClosestPair(input);break;
   case'kd-tree-geo':res=demoKdTreeGeo(input);break;
   case'delaunay':res=demoDelaunay(input);break;
   case'lloyd':res=demoLloyd(input);break;
   case'calipers':res=demoCalipers(input);break;
   case'diameter-rect':res=demoDiameterRect(input);break;
   case'welzl':res=demoWelzl(input);break;
   case'sat':res=demoSat(input);break;
   case'douglas-peucker':res=demoDouglasPeucker(input);break;
   case'marching':res=demoMarching(input);break;
   case'ransac':res=demoRansac(input);break;
   case'jps':res=demoJps(input);break;
   default:throw Error('No interactive implementation is available for this lesson.');
  }
 }catch(e){
  res={encoded:'Input or runtime error',decoded:e.message};
 }
 const el=$('#labEncoded');
 if(res.html){el.innerHTML=res.html+'\n\n'+res.encoded}else{el.textContent=res.encoded}
 $('#labDecoded').textContent=res.decoded;
 if(!initial)toast('Lab complete');
}

const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function toast(msg){const el=$('#toast');el.textContent=msg;el.classList.add('show');setTimeout(()=>el.classList.remove('show'),1900)}
function save(){try{localStorage.setItem('az-geometry-lab-v1',JSON.stringify({schemaVersion:1,completed:[...state.completed],bookmarks:[...state.bookmarks],theme:state.theme,current:state.current,drafts:state.drafts}))}catch(e){}}
function load(){try{const d=JSON.parse(localStorage.getItem('az-geometry-lab-v1')||'null');if(!d||d.schemaVersion!==1)return;
 state.completed=new Set((d.completed||[]).filter(id=>byId[id]));
 state.bookmarks=new Set((d.bookmarks||[]).filter(id=>byId[id]));
 state.theme=['system','light','dark'].includes(d.theme)?d.theme:'system';
 state.current=byId[d.current]?d.current:null;
 state.drafts=d.drafts&&typeof d.drafts==='object'?d.drafts:{};}catch(e){}}
function applyTheme(){let t=state.theme;if(t==='system')t=matchMedia('(prefers-color-scheme: light)').matches?'light':'dark';document.documentElement.dataset.theme=t;$('#themeSelect').value=state.theme}
function getChapter(id){return CHAPTERS.find(c=>c.ids.includes(id))||CHAPTERS[0]}
function progress(){
 const n=state.completed.size,t=LESSONS.length;
 $('#progressText').textContent=`${n} / ${t}`;
 $('#progressFill').style.width=(n/t*100)+'%';
 $('#lessonCount').textContent=t+' lessons';
 $('#catalogCount').textContent=`${CHAPTERS.length} chapters · ${t} lessons · ${LESSONS.filter(l=>l.demo&&l.demo!=='none').length} labs`;
 $('#progressBar').setAttribute('aria-valuenow',String(Math.round(n/t*100)));
}
function renderTree(){
 const q=$('#searchInput').value.toLowerCase().trim(),ch=$('#chapterFilter').value;
 const root=$('#courseTree');root.textContent='';
 for(const c of CHAPTERS){
  if(ch!=='all'&&c.id!==ch)continue;
  const rows=c.ids.map(id=>byId[id]).filter(x=>x&&(!q||(x.title+' '+x.summary+' '+x.kind+' '+c.title).toLowerCase().includes(q)));
  if(!rows.length)continue;
  const group=document.createElement('section');
  const label=document.createElement('div');label.className='group-label';
  label.innerHTML=`<span>${esc(c.title)}</span><span>${rows.length}</span>`;
  group.append(label);
  rows.forEach(l=>{
   const b=document.createElement('button');b.type='button';
   b.className='link'+(state.current===l.id?' active':'');
   b.dataset.lesson=l.id;
   b.innerHTML=`<span class="num">${String(LESSONS.indexOf(l)+1).padStart(2,'0')}</span><span class="name">${esc(l.title)}</span>${state.completed.has(l.id)?'<span class="done" aria-label="completed">✓</span>':''}`;
   group.append(b);
  });
  root.append(group);
 }
 if(!root.children.length)root.innerHTML='<p class="muted">No matching lessons. Try another search.</p>';
 progress();
}
function listToHTML(a){return `<ol class="steps">${a.map(x=>`<li>${esc(x)}</li>`).join('')}</ol>`}
function refsHTML(r){return r&&r.length?`<div class="references">${r.map(x=>`<a target="_blank" rel="noopener noreferrer" href="${esc(x[1])}">${esc(x[0])} ↗</a>`).join('')}</div>`:'<p class="muted">See the recommended textbooks and papers for a full treatment.</p>'}
function codeRecord(l){if(l.codeKey==='none')return null;return CODE[l.codeKey]||CODE[l.demo]||null}
function codeText(l){
 const c=codeRecord(l);
 if(c&&c.python)return c.python;
 return '# CONCEPT OUTLINE, NOT EXECUTABLE PYTHON\n# Lesson: '+l.title+'\n\n# Core idea\n# '+String(l.summary||'').replace(/\n/g,'\n# ')+'\n\n# Pseudocode from the lesson\n'+String(l.pseudo||'').split('\n').map(x=>'# '+x).join('\n')+'\n';
}
function statusClass(l){return /Runnable/.test(l.status)?'good':'warn'}

function renderLesson(id){
 const l=byId[id];if(!l){renderHome();return}
 state.page='lesson';state.current=id;
 const c=getChapter(id);const index=LESSONS.indexOf(l);const next=LESSONS[(index+1)%LESSONS.length];
 const hasDemo=l.demo&&l.demo!=='none';
 const demoArea=hasDemo?`<section class="panel"><div class="panel-head"><h2>${esc(l.demoTitle||'Interactive teaching lab')}</h2><p>Everything runs in your browser with SVG rendering. This is a teaching model, not a production geometry library.</p></div><div class="body"><div class="lab-top"><label for="labInput">Input</label><button class="btn" id="resetSample">Reset sample</button><button class="btn primary" id="runLab">Run lab</button></div><textarea class="lab-input" id="labInput" aria-label="Lab input">${esc(l.sample||'')}</textarea><div class="notice info"><strong>Format:</strong> most labs take points as "x y" one per line. Some take a blank line to separate two parts (polygons, points from query). See the sample for the exact format.</div><div class="lab-cols"><div><div class="label">Output</div><div class="lab-output" id="labEncoded">Run the lab to see output.</div></div><div><div class="label">Explanation</div><div class="lab-output" id="labDecoded">Step notes appear here.</div></div></div></div></section>`:'';
 const references=refsHTML(l.refs);
 const code=state.drafts[id]??codeText(l);
 $('#mainView').innerHTML=`<div class="breadcrumb">Geometry Lab / ${esc(c.title)}</div>
<header class="header">
 <div class="eyebrow">LESSON ${String(index+1).padStart(2,'0')} · ${esc(l.kind)}</div>
 <h1>${esc(l.title)}</h1>
 <p>${esc(l.summary)}</p>
 <div class="tags"><span class="tag">Level ${l.level}</span><span class="tag ${statusClass(l)}">${esc(l.status)}</span><span class="tag">${esc(c.title.replace(/^\d+\.\s*/,''))}</span></div>
 <div class="header-actions">
  <button class="btn" id="bookmarkBtn">${state.bookmarks.has(id)?'★ Bookmarked':'☆ Bookmark'}</button>
  <button class="btn primary" id="completeBtn">${state.completed.has(id)?'✓ Completed':'Mark complete'}</button>
 </div>
</header>
<section class="panel"><div class="panel-head"><h2>1. Understand the idea</h2><p>Plain language and a mental picture</p></div><div class="body idea"><div><p>${esc(l.summary)}</p><p><strong>What problem it solves:</strong> ${esc(l.problem)}</p><div class="takeaway"><strong>Takeaway:</strong> ${esc(l.output)}</div></div><aside class="mental"><small>Mental picture</small><strong>${esc(l.mental)}</strong><p>${esc(l.mentalText)}</p></aside></div></section>
<section class="panel"><div class="panel-head"><h2>2. Input and output</h2><p>Know what goes in and what comes out</p></div><div class="body two"><div class="mini"><h3>Input</h3><p>${esc(l.input)}</p></div><div class="mini"><h3>Output</h3><p>${esc(l.output)}</p></div></div></section>
<section class="panel"><div class="panel-head"><h2>3. How it works</h2><p>Step by step, with the key rule that makes it correct</p></div><div class="body two"><div>${listToHTML(l.steps)}<div class="takeaway" style="margin-top:14px"><strong>Key rule:</strong> ${esc(l.invariant)}</div></div><pre class="pseudo">${esc(l.pseudo)}</pre></div><div class="table-wrap" style="margin-top:16px"><table><thead><tr><th>Step</th><th>What happens</th><th>Why it matters</th></tr></thead><tbody>${l.trace.map(r=>`<tr>${r.map(v=>`<td>${esc(v)}</td>`).join('')}</tr>`).join('')}</tbody></table></div></section>
${demoArea}
<section class="panel"><div class="panel-head"><h2>4. Cost and stability</h2><p>Costs depend on the number of objects, degeneracies and floating point precision. These are scope labels, not universal benchmarks.</p></div><div class="body"><div class="tiles">${l.complexity.map((x,i)=>`<div class="tile"><span>${['Time','Space','Interpretation'][i]}</span><strong>${esc(x.split(' ').slice(0,2).join(' '))}</strong><small>${esc(x)}</small></div>`).join('')}</div><div class="two" style="margin-top:12px"><div class="mini"><h3>Strengths</h3><p>${esc(l.strength)}</p></div><div class="mini"><h3>Limits</h3><p>${esc(l.limits)}</p></div></div></div></section>
<section class="panel"><div class="panel-head"><h2>5. Code and usage</h2><p>Reference code is for learning. Real code should use a vetted geometry library.</p></div><div class="code-head"><div><span class="tag">${codeRecord(l)?'Python example':'Concept outline, not executable'}</span> <span class="tag">Editable</span></div><div class="header-actions" style="margin:0"><button class="btn" id="copyCode">Copy code</button><button class="btn" id="downloadCode">Download</button></div></div><textarea id="codeEditor" class="code-editor" spellcheck="false" aria-label="Editable Python code">${esc(code)}</textarea><div class="code-foot"><span>${codeRecord(l)?'Reference example. The in-page lab runs its own JavaScript implementation.':'Lesson-specific outline, not an implementation.'}</span><span id="codeStatus">Local draft</span></div><div class="body"><div class="mini"><h3>Where it is used</h3><p>${esc(l.uses)}</p></div><div class="notice" style="margin-top:12px"><strong>Common pitfall:</strong> ${esc(l.pitfall)}</div></div></section>
<section class="panel"><div class="panel-head"><h2>6. Choices and alternatives</h2><p>Pick based on the problem, the dimension and the required precision</p></div><div class="body two"><div class="mini"><h3>When to use this</h3><p>${esc(l.strength)}</p></div><div class="mini"><h3>When to use something else</h3><p>${esc(l.limits)}</p></div></div></section>
<section class="panel"><div class="panel-head"><h2>7. Check yourself</h2><p>Try to answer before you open the explanation</p></div><div class="body"><details class="practice"><summary>${esc(l.question)}</summary><p>${esc(l.answer)}</p></details></div></section>
<section class="panel"><div class="panel-head"><h2>8. References</h2><p>Standard references for this topic</p></div><div class="body">${references}<p class="muted" style="font-size:11.5px;margin-top:14px">The labs on this page are teaching implementations. For production work use CGAL, Boost.Geometry, Shapely, scipy.spatial, or another vetted geometry library.</p></div></section>
<footer class="footer"><span>aznur / geometry lab · local learning</span><span>Lesson ${index+1} of ${LESSONS.length} · Next: ${esc(next.title)}</span><button class="btn" id="nextLesson">Next →</button></footer>`;

 $('#bookmarkBtn').onclick=()=>{state.bookmarks.has(id)?state.bookmarks.delete(id):state.bookmarks.add(id);save();renderLesson(id);toast(state.bookmarks.has(id)?'Bookmarked':'Bookmark removed')};
 $('#completeBtn').onclick=()=>{state.completed.has(id)?state.completed.delete(id):state.completed.add(id);save();renderTree();renderLesson(id);toast(state.completed.has(id)?'Lesson completed':'Completion removed')};
 $('#nextLesson').onclick=()=>openLesson(next.id);
 $('#copyCode').onclick=async()=>{const v=$('#codeEditor').value;try{await navigator.clipboard.writeText(v);toast('Code copied')}catch{const ta=$('#codeEditor');ta.select();document.execCommand('copy');toast('Code copied')}};
 $('#downloadCode').onclick=()=>{const r=codeRecord(l);downloadText(`${id}.${r?'py':'txt'}`,$('#codeEditor').value,r?'text/x-python':'text/plain')};
 $('#codeEditor').addEventListener('input',()=>{state.drafts[id]=$('#codeEditor').value;save();$('#codeStatus').textContent='Draft saved locally'});
 if(hasDemo){
  $('#runLab').onclick=()=>runLab(l);
  $('#resetSample').onclick=()=>{$('#labInput').value=l.sample||'';$('#labEncoded').textContent='Run the lab to see output.';$('#labDecoded').textContent='Step notes appear here.'};
  runLab(l,true);
 }
 renderTree();save();
 if(location.hash!==`#${id}`)history.replaceState(null,'',`#${id}`);
}

function renderHome(){
 state.page='home';
 $('#mainView').innerHTML=`<div class="home-hero"><div class="eyebrow">AZNUR · ENGINEERING TOOLBOOK</div><h1>Understand computational geometry from orientation to JPS pathfinding.</h1><p>A beginner friendly course covering geometric primitives, segment and polygon problems, convex hulls, proximity structures, Voronoi and Delaunay, hull applications, arrangements, collision detection, simplification, and registration and pathfinding. Every lesson has a plain explanation and most have a runnable lab with SVG rendering.</p><div class="header-actions" style="margin:0"><button class="btn primary" id="startFirst">Start at the beginning</button><button class="btn" id="resumeLesson">Continue lesson</button></div></div>
<div class="stats"><div class="stat"><strong>${CHAPTERS.length}</strong><span>chapters</span></div><div class="stat"><strong>${LESSONS.length}</strong><span>lessons</span></div><div class="stat"><strong>${LESSONS.filter(l=>l.demo&&l.demo!=='none').length}</strong><span>runnable labs</span></div><div class="stat"><strong>1</strong><span>standalone HTML file</span></div></div>
<section class="panel"><div class="panel-head"><h2>Honest scope</h2><p>One app covers the whole curriculum. Production geometry libraries are a separate engineering project.</p></div><div class="body two"><div class="mini"><h3>What runs here</h3><p>Points and vectors, orientation, distances, segment intersection, point-in-polygon by ray casting, Graham scan, Andrew monotone chain, Jarvis march, Quickhull, closest pair (brute force), k-d tree nearest neighbour, Delaunay (naive O(n³) via circumcircle test), Lloyd relaxation (k-means approximation), rotating calipers diameter, minimum-area rectangle, Welzl smallest enclosing circle, SAT 2D collision, Douglas-Peucker simplification, marching squares, RANSAC line fitting, and grid BFS pathfinding.</p></div><div class="mini"><h3>What does not run here</h3><p>Production implementations of Fortune's algorithm, Bowyer-Watson Delaunay, half-plane intersection, line arrangements, alpha shapes, medial axis, GJK/EPA, Minkowski sums, marching cubes, mesh decimation, ICP, homography estimation, D* Lite, Theta*, and full Jump Point Search. For real work use CGAL, Boost.Geometry, Shapely, scipy.spatial, or another vetted library.</p></div></div></section>
<div class="panel"><div class="panel-head"><h2>Course map</h2><p>Pick a chapter. The path runs from primitives to pathfinding.</p></div><div class="body"><div class="chapter-cards">${CHAPTERS.map((c,i)=>`<button class="chapter-card" data-chapter="${c.id}"><span class="num">CHAPTER ${String(i+1).padStart(2,'0')} · ${c.ids.length} LESSONS</span><strong>${esc(c.title.replace(/^\d+\.\s*/,''))}</strong><p>${esc(c.desc)}</p></button>`).join('')}</div></div></div>
<footer class="footer"><span>aznur / geometry lab</span><span>Single file · no external runtime dependencies</span></footer>`;
 $('#startFirst').onclick=()=>openLesson('points-vectors');
 $('#resumeLesson').onclick=()=>openLesson(state.current&&byId[state.current]?state.current:'points-vectors');
 $('#mainView').querySelectorAll('[data-chapter]').forEach(b=>b.onclick=()=>{const c=CHAPTERS.find(x=>x.id===b.dataset.chapter);if(c)openLesson(c.ids[0])});
}

function renderProgressPage(){
 state.page='progress';
 $('#mainView').innerHTML=`<div class="breadcrumb">Geometry Lab / Bookmarks & progress</div><header class="header"><div class="eyebrow">LOCAL ONLY</div><h1>Bookmarks and progress</h1><p>Your progress stays in this browser. Export the JSON to move it or keep a backup.</p></header>
<section class="panel"><div class="panel-head"><h2>Completed lessons</h2></div><div class="body">${state.completed.size?`<div class="references">${[...state.completed].map(id=>`<a href="#${id}" data-open="${id}">${esc(byId[id].title)}</a>`).join('')}</div>`:'<p class="muted">No lessons marked complete yet.</p>'}</div></section>
<section class="panel"><div class="panel-head"><h2>Bookmarks</h2></div><div class="body">${state.bookmarks.size?`<div class="references">${[...state.bookmarks].map(id=>`<a href="#${id}" data-open="${id}">${esc(byId[id].title)}</a>`).join('')}</div>`:'<p class="muted">No bookmarks yet.</p>'}</div></section>
<section class="panel"><div class="panel-head"><h2>Progress data</h2></div><div class="body"><div class="header-actions" style="margin:0"><button class="btn primary" id="exportProgress">Export progress JSON</button><button class="btn" id="clearProgress">Clear completion marks</button></div><p class="muted" style="font-size:12.5px;margin-top:14px">Import accepts only known lesson IDs and a supported schema version.</p></div></section>`;
 $('#mainView').querySelectorAll('[data-open]').forEach(a=>a.onclick=e=>{e.preventDefault();openLesson(a.dataset.open)});
 $('#exportProgress').onclick=exportProgress;
 $('#clearProgress').onclick=()=>{if(confirm('Clear all completion marks?')){state.completed.clear();save();renderProgressPage();renderTree();toast('Completion marks cleared')}};
}

function openLesson(id){if(!byId[id])return;renderLesson(id);renderTree();$('#mainView').focus({preventScroll:true});window.scrollTo(0,0)}
function downloadText(name,text,type='text/plain'){const blob=new Blob([text],{type});const url=URL.createObjectURL(blob);const a=document.createElement('a');a.href=url;a.download=name;document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),800)}
function exportProgress(){downloadText('az-geometry-lab-progress.json',JSON.stringify({schemaVersion:1,completed:[...state.completed],bookmarks:[...state.bookmarks],theme:state.theme,current:state.current,drafts:state.drafts},null,2),'application/json');toast('Progress exported')}
function importProgressFile(file){
 if(file.size>2_000_000){toast('Import rejected: file too large');return}
 const r=new FileReader();
 r.onload=()=>{try{
  const d=JSON.parse(r.result);
  if(!d||d.schemaVersion!==1||!Array.isArray(d.completed)||!Array.isArray(d.bookmarks)||typeof d.drafts!=='object')throw Error('bad schema');
  if([...d.completed,...d.bookmarks].some(id=>typeof id!=='string'||!byId[id]))throw Error('unknown id');
  state.completed=new Set(d.completed);
  state.bookmarks=new Set(d.bookmarks);
  state.theme=['system','light','dark'].includes(d.theme)?d.theme:'system';
  state.current=byId[d.current]?d.current:null;
  state.drafts=Object.fromEntries(Object.entries(d.drafts).filter(([k,v])=>byId[k]&&typeof v==='string'&&v.length<100000));
  applyTheme();save();renderTree();
  state.current?openLesson(state.current):renderHome();
  toast('Progress imported');
 }catch(e){toast('Import rejected: invalid progress data')}};
 r.readAsText(file);
}

function bindGlobal(){
 $('#themeSelect').onchange=()=>{state.theme=$('#themeSelect').value;applyTheme();save()};
 $('#printBtn').onclick=()=>print();
 $('#exportBtn').onclick=exportProgress;
 $('#importBtn').onclick=()=>$('#importFile').click();
 $('#importFile').onchange=e=>{if(e.target.files[0])importProgressFile(e.target.files[0]);e.target.value=''};
 $('#searchInput').oninput=renderTree;
 $('#chapterFilter').onchange=renderTree;
 $('#homeLink').onclick=e=>{e.preventDefault();renderHome();history.replaceState(null,'','#home')};
 $('#courseTree').onclick=e=>{const b=e.target.closest('[data-lesson]');if(b)openLesson(b.dataset.lesson)};
 document.querySelectorAll('[data-page="home"]').forEach(b=>b.onclick=renderHome);
 document.querySelectorAll('[data-page="progress"]').forEach(b=>b.onclick=renderProgressPage);
 document.addEventListener('keydown',e=>{
  if(e.key==='/'&&!['INPUT','TEXTAREA','SELECT'].includes(document.activeElement.tagName)){e.preventDefault();$('#searchInput').focus()}
  if(e.key.toLowerCase()==='t'&&!['INPUT','TEXTAREA','SELECT'].includes(document.activeElement.tagName)){
   state.theme=state.theme==='dark'?'light':state.theme==='light'?'system':'dark';
   applyTheme();save();
  }
 });
}

function init(){
 load();
 applyTheme();
 CHAPTERS.forEach(c=>{const op=document.createElement('option');op.value=c.id;op.textContent=c.title;$('#chapterFilter').append(op)});
 bindGlobal();
 renderTree();
 const hash=location.hash.replace(/^#/,'');
 if(hash&&byId[hash])renderLesson(hash);
 else if(state.current&&byId[state.current])renderLesson(state.current);
 else renderHome();
 progress();
}
init();
</script>
</body>
</html>
